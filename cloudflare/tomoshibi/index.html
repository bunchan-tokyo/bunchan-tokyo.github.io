<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>灯火の語り部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#16120e; --panel:#221b14; --panel2:#2b231a; --line:#3a2e22; --line2:#5a4a36;
  --ink:#efe3cc; --sub:#cdbfa6; --mute:#a8987d;
  --amber:#e0a84a; --amber2:#f3c878; --teal:#7fb7b0; --teal2:#a9d6cf; --rust:#d98a6a; --rust2:#eab49d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#16120e; } }
:root[data-theme="dark"]{ --bg:#16120e; }
html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg); height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:'Noto Sans JP',system-ui,sans-serif; -webkit-tap-highlight-color:transparent; overflow:hidden}
button,input{font:inherit}
.app{max-width:480px; height:100%; margin:0 auto; display:flex; flex-direction:column}
.top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px 8px}
.chapter{font-family:'Shippori Mincho',serif; font-size:16px; color:var(--amber); white-space:nowrap}
.status{display:flex; align-items:center; gap:10px}
.hp{display:flex; gap:3px}
.hp i{width:12px; height:8px; border-radius:4px; background:var(--rust); transition:background .4s, transform .4s}
.hp i.off{background:var(--line); transform:scaleY(.6)}
.clues{display:flex; gap:4px; align-items:center}
.clue{width:28px; height:28px; border-radius:8px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--line2); transition:all .4s}
.clue.on{border-color:var(--amber); color:var(--amber); background:#2e2416; box-shadow:0 0 10px rgba(224,168,74,.35)}
.clue.pop{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.heart{display:flex; gap:3px; align-items:center}
.heart svg{transition:transform .4s, opacity .4s}
.heart .off{opacity:.25}
.heart .new{animation:pop .7s ease}
.iconbtn{position:relative; width:40px; height:40px; border-radius:20px; border:1px solid var(--line); background:transparent; color:var(--sub); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0}
.iconbtn[aria-pressed="false"]{opacity:.45}
.badge{position:absolute; top:2px; right:2px; width:10px; height:10px; border-radius:5px; background:var(--amber); display:none; animation:pulse 1.2s ease-in-out infinite}
.badge.on{display:block}
@keyframes pulse{50%{transform:scale(1.4)}}

.stage{position:relative; margin:0 10px; border-radius:18px; overflow:hidden; border:1px solid var(--line); aspect-ratio:336/230; background:#0d0f13; flex-shrink:0}
.stage.shake{animation:sshake .45s ease}
@keyframes sshake{10%,50%,90%{transform:translateX(-7px)}30%,70%{transform:translateX(7px)}}
.stage .scene{position:absolute; inset:0; transition:opacity .8s}
.stage .scene.fade{opacity:0}
.stage .scene svg{display:block; width:100%; height:100%}
#fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.flash{position:absolute; inset:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 80px 20px rgba(217,90,60,.85)}
.flash.on{animation:flash .6s ease}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.slot{position:absolute; bottom:-4px; height:84%; aspect-ratio:120/140; transition:transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .4s, filter .35s; opacity:0; pointer-events:none}
.slot.L{left:-2%; transform:translateX(-40%)}
.slot.R{right:-2%; transform:translateX(40%)}
.slot.on{opacity:1; transform:none}
.slot.dim{filter:brightness(.45) saturate(.6)}
.slot.hop{animation:hop .35s ease}
@keyframes hop{40%{transform:translateY(-8px)}}
.slot svg{width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.65))}
.por .breathe{transform-box:view-box; transform-origin:60px 140px; animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.012,1.022)}}
.por .ec{opacity:0}
.por .eo{animation:blinkO 4.3s infinite}
.por .ec{animation:blinkC 4.3s infinite}
.por .eo,.por .ec{animation-delay:var(--d)}
@keyframes blinkO{0%,93%,100%{opacity:1}95%,97%{opacity:0}}
@keyframes blinkC{0%,93%,100%{opacity:0}95%,97%{opacity:1}}
.por .mo{opacity:0}
.por.talk .mo{animation:mo .24s steps(1) infinite}
.por.talk .mc{animation:mc .24s steps(1) infinite}
@keyframes mo{0%{opacity:1}50%{opacity:0}}
@keyframes mc{0%{opacity:0}50%{opacity:1}}
.ftoast{position:absolute; left:50%; top:10px; transform:translate(-50%,-10px); background:rgba(22,18,14,.92); border:1px solid var(--amber); color:var(--amber2); border-radius:999px; padding:6px 14px; font-size:13px; white-space:nowrap; opacity:0; transition:opacity .35s, transform .35s; pointer-events:none; z-index:3}
.ftoast.on{opacity:1; transform:translate(-50%,0)}
.fly{position:fixed; z-index:40; width:34px; height:34px; border-radius:10px; background:#2e2416; border:1px solid var(--amber); color:var(--amber2); display:flex; align-items:center; justify-content:center; pointer-events:none; box-shadow:0 0 18px rgba(243,200,120,.7)}
.fog{animation:drift 18s ease-in-out infinite alternate}
.fog2{animation:drift 26s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.reveal{opacity:0; transition:opacity 1.2s}
.reveal.on{opacity:1}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.dlg{margin:10px 10px 0; min-height:96px; border-radius:16px; background:var(--panel); border:1px solid var(--line); padding:12px 16px 14px; position:relative; cursor:pointer; flex-shrink:0; transition:border-color .3s}
.dlg.spk{border-color:var(--line2)}
.who{font-size:13px; font-weight:700; min-height:18px}
.line{font-family:'Shippori Mincho',serif; font-size:18px; line-height:1.75; margin-top:2px; min-height:31px}
.line.narr{color:var(--sub)}
.next{position:absolute; right:14px; bottom:8px; color:var(--amber); font-size:12px; animation:nudge .9s ease-in-out infinite}
.next[hidden]{display:none}
@keyframes nudge{50%{transform:translateY(3px)}}
.thinking{display:flex; align-items:center; gap:10px; color:var(--mute); font-size:14px; margin-top:8px}
.flame{width:10px; height:16px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; background:var(--amber); animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg); opacity:.8}to{transform:scale(.85,1.1) rotate(4deg); opacity:1}}

.controls{margin-top:auto; padding:8px 10px 12px; display:flex; flex-direction:column; gap:8px}
.choices{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; min-height:56px}
.choices.one{grid-template-columns:1fr}
.choice{min-height:56px; border-radius:12px; border:1px solid var(--line2); background:var(--panel); color:var(--ink); font-size:13px; line-height:1.35; padding:6px 8px; cursor:pointer; animation:rise .35s ease both}
.choice:nth-child(2){animation-delay:.07s} .choice:nth-child(3){animation-delay:.14s}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.choice:active{transform:scale(.96)}
.choice.key{border-color:var(--teal); color:var(--teal2); background:#17221f; box-shadow:0 0 12px rgba(127,183,176,.25)}
.choice.go{background:var(--amber); color:#16120e; border:none; font-weight:700; font-size:16px; box-shadow:0 0 18px rgba(224,168,74,.35)}
.choice:disabled,.send:disabled{opacity:.4}
.items{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
.item{flex-shrink:0; height:34px; padding:0 12px 0 8px; border-radius:17px; border:1px solid var(--line); background:transparent; color:var(--sub); font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer}
.item svg{color:var(--amber)}
.item.new{animation:pop .7s ease; border-color:var(--amber)}
.free{display:flex; gap:8px}
.free input{flex:1; min-width:0; height:46px; border-radius:23px; border:1px solid var(--line2); background:#100d0a; color:var(--ink); font-size:15px; padding:0 16px}
.free input:focus{border-color:var(--amber)}
.free input::placeholder{color:#8a7b63}
.send{width:46px; height:46px; border-radius:23px; border:none; background:var(--amber); color:#16120e; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0}
.mic.live{border-color:var(--rust); color:var(--rust)}
:focus-visible{outline:2px solid var(--amber2); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

.overlay{position:fixed; inset:0; background:rgba(8,6,4,.94); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20; overflow-y:auto; animation:ovIn .4s ease}
.overlay[hidden]{display:none}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.card{width:100%; max-width:420px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px}
.title{font-family:'Shippori Mincho',serif; font-weight:800; font-size:44px; line-height:1.15; margin:0}
.title span{display:inline-block; opacity:0; animation:ink .7s ease forwards}
@keyframes ink{from{opacity:0; transform:translateY(8px); filter:blur(6px)}to{opacity:1; transform:none; filter:none}}
.lead{font-family:'Shippori Mincho',serif; color:var(--amber); font-size:18px}
.desc{color:var(--sub); font-size:15px; line-height:1.8; font-family:'Shippori Mincho',serif}
.big{min-height:52px; padding:0 32px; border-radius:26px; border:none; background:var(--amber); color:#16120e; font-weight:700; font-size:16px; cursor:pointer}
.big:active{transform:scale(.97)}
.ghost{min-height:44px; padding:0 22px; border-radius:22px; border:1px solid var(--line2); background:transparent; color:var(--ink); cursor:pointer}
.castrow{display:flex; justify-content:center; gap:2px}
.castrow > div{width:96px; height:112px; opacity:0; animation:rise .5s ease forwards}
.castrow > div:nth-child(2){animation-delay:.15s} .castrow > div:nth-child(3){animation-delay:.3s}
.castrow svg{width:100%; height:100%}
.ends{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; width:100%}
.endslot{border-radius:12px; border:1px solid var(--line); padding:8px; font-family:'Shippori Mincho',serif; font-size:14px; color:#6b5f4c}
.endslot.got{border-color:var(--amber); color:var(--amber2)}

.dicewhat{font-family:'Shippori Mincho',serif; font-size:22px}
.target small{display:block; font-size:12px; color:var(--mute)}
.target strong{font-family:'Shippori Mincho',serif; font-size:44px; color:var(--amber); line-height:1}
.mods{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.mod{border-radius:999px; padding:6px 12px; font-size:13px; background:#1f3533; color:var(--teal2); animation:rise .4s ease both}
.mod:nth-child(2){animation-delay:.1s} .mod:nth-child(3){animation-delay:.2s} .mod:nth-child(4){animation-delay:.3s}
.mod.neg{background:#3b231b; color:var(--rust2)}
.dicebox{position:relative; width:200px; height:220px; perspective:600px}
.die{position:absolute; left:5px; top:0; width:190px; height:190px; border:none; background:none; padding:0; cursor:pointer; transform-style:preserve-3d}
.die svg{width:100%; height:100%; overflow:visible}
.die.idle{animation:hover 2.4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px) rotate(4deg)}}
.die.rolling{animation:tumble .5s linear infinite}
@keyframes tumble{0%{transform:translateY(-30px) rotate3d(1,1,0,0deg)}50%{transform:translateY(-60px) rotate3d(1,.6,.2,180deg)}100%{transform:translateY(-30px) rotate3d(1,1,0,360deg)}}
.die.land{animation:land .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes land{0%{transform:translateY(-50px) scale(1.15)}60%{transform:translateY(6px) scale(.96,1.04)}100%{transform:none}}
.shadow{position:absolute; left:50%; bottom:0; width:120px; height:16px; margin-left:-60px; border-radius:50%; background:rgba(0,0,0,.6); filter:blur(4px); transition:transform .3s}
.rolling ~ .shadow{transform:scale(.6)}
.verdict{font-family:'Shippori Mincho',serif; font-size:34px; font-weight:800; min-height:44px}
.verdict.show{animation:stamp .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:scale(2.2); opacity:0}to{transform:none; opacity:1}}
.verdict.ok{color:var(--amber2)} .verdict.ng{color:var(--rust2)} .verdict.crit{color:var(--teal2)}
.sum{color:var(--sub); font-size:15px; min-height:22px}
.burst{position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:50}
.mapwrap{width:100%; max-width:380px}
.mapwrap svg{width:100%; height:auto; display:block}
.relnew{animation:relglow 1.4s ease-in-out 3}
@keyframes relglow{50%{stroke-width:6}}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important} }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="chapter" id="chapter">第一幕</div>
    <div class="status">
      <div class="hp" id="hp"></div>
      <div class="clues" id="clues" aria-label="手がかり"></div>
      <button class="iconbtn" id="mapBtn" aria-label="人物と関係">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="7" r="3"></circle><circle cx="18" cy="7" r="3"></circle><circle cx="12" cy="18" r="3"></circle><path d="M9 7h6M7.5 9.5l3 6M16.5 9.5l-3 6"></path></svg>
        <span class="badge" id="mapBadge"></span>
      </button>
      <button class="iconbtn" id="voiceBtn" aria-pressed="true" aria-label="読み上げ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"></path></svg>
      </button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="scene" id="scene"></div>
    <canvas id="fx"></canvas>
    <div class="slot L" id="slotL"></div>
    <div class="slot R" id="slotR"></div>
    <div class="flash" id="flash"></div>
    <div class="ftoast" id="ftoast"></div>
  </div>

  <div class="dlg" id="dlg" tabindex="0" aria-live="polite">
    <div class="who" id="who"></div>
    <div class="line" id="line"></div>
    <div class="next" id="nextMark" hidden>▼</div>
  </div>

  <div class="controls">
    <div class="choices" id="choices"></div>
    <div class="items" id="items"></div>
    <form class="free" id="freeForm">
      <label for="freeInput" class="sr">自由に行動を書く</label>
      <input id="freeInput" autocomplete="off" placeholder="自由に書く">
      <button type="button" class="iconbtn mic" id="micBtn" aria-label="声で入力" hidden style="width:46px;height:46px;border-radius:23px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
      <button type="submit" class="send" id="sendBtn" aria-label="送る">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
    </form>
  </div>
</div>

<div class="overlay" id="titleOv">
  <div class="card">
    <div class="castrow" id="titleCast"></div>
    <h1 class="title" id="titleText">灯火の語り部</h1>
    <div class="lead">霧の井戸</div>
    <div class="desc">消えた少女を、井戸の底へ探しに行く。</div>
    <div id="keyBlock" style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px">
      <label for="groqKey" style="font-size:13px;color:var(--sub);text-align:left">Groq APIキー（任意）</label>
      <input id="groqKey" type="password" autocomplete="off" placeholder="gsk_..." style="height:44px;border-radius:12px;border:1px solid var(--line2);background:#100d0a;color:var(--ink);font-size:14px;padding:0 14px;width:100%">
      <div style="font-size:12px;color:var(--mute);line-height:1.6;text-align:left">キーはこの端末のブラウザ内にだけ保存され、Groq公式APIへ直接送られます。未入力でも台本モードで遊べます。キーは <a href="https://console.groq.com/keys" target="_blank" rel="noopener" style="color:var(--amber)">console.groq.com</a> で無料発行できます</div>
    </div>
    <button class="big" id="startBtn">はじめる</button>
    <div class="ends" id="titleEnds"></div>
  </div>
</div>

<div class="overlay" id="actOv" hidden>
  <div class="card">
    <div class="lead" id="actNum"></div>
    <h2 class="title" id="actName"></h2>
    <button class="big" id="actGo">つづける</button>
  </div>
</div>

<div class="overlay" id="mapOv" hidden style="z-index:30;background:#0c0a08">
  <div class="card">
    <div class="lead">人物と関係</div>
    <div class="mapwrap" id="mapBox"></div>
    <button class="ghost" id="mapClose">閉じる</button>
  </div>
</div>

<div class="overlay" id="diceOv" hidden>
  <div class="card">
    <div class="dicewhat" id="diceWhat"></div>
    <div class="target"><small>必要な目</small><strong id="diceTarget">12</strong></div>
    <div class="mods" id="diceMods"></div>
    <div class="dicebox">
      <button class="die idle" id="dieBtn" aria-label="ダイスを振る">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle id="dieGlow" cx="100" cy="100" r="98" fill="#e0a84a" fill-opacity=".1"></circle>
          <path d="M100 14 L176 58 L176 142 L100 186 L24 142 L24 58 Z" fill="#1d1712" stroke="#e0a84a" stroke-width="4" stroke-linejoin="round"></path>
          <path d="M100 14 L58 100 L142 100 Z M58 100 L100 186 L142 100 M24 58 L58 100 L24 142 M176 58 L142 100 L176 142" stroke="#8d6a32" stroke-width="2" fill="none"></path>
          <text id="dieNum" x="100" y="90" text-anchor="middle" font-family="Shippori Mincho, serif" font-weight="800" font-size="40" fill="#fff4dc">?</text>
        </svg>
      </button>
      <div class="shadow"></div>
    </div>
    <div class="verdict" id="verdict">タップして振る</div>
    <div class="sum" id="diceSum"></div>
    <button class="big" id="diceNext" hidden>続きを見る</button>
  </div>
</div>

<div class="overlay" id="endOv" hidden>
  <div class="card">
    <div class="lead">結末</div>
    <h2 class="title" style="font-size:38px" id="endTitle"></h2>
    <div class="castrow" id="endCast"></div>
    <div class="desc" id="endDesc"></div>
    <div class="ends" id="endEnds"></div>
    <button class="big" id="againBtn">もう一度はじめる</button>
    <button class="ghost" id="endMap">人物と関係を見る</button>
  </div>
</div>

<script>
// ================= 登場人物（表情つき） =================
const EMOS=["普通","笑","悲","驚","怒"];
// 光は右（松明側）から。顔は写実寄り、色は落ち着かせる
const CH = {
  gren:{ skin:"#b08262", skinD:"#76523a", rim:"#f3c878", eye:{cx:60,y:56,dx:10,iris:"#3a2c22"}, brow:"#3e2a1c", mouth:{x:60,y:81},
    back:`<path d="M6 140 C 10 104, 28 90, 60 88 C 92 90, 110 104, 114 140 Z" fill="#43301f"/>
      <path d="M22 140 C 26 118, 34 104, 44 98 L 46 140 Z" fill="#33251a"/>
      <path d="M40 98 L80 98 L86 140 L34 140 Z" fill="#a89a80"/><path d="M48 112 l6 20 M70 106 l-4 26" stroke="#8a7c64" stroke-width="1.5"/>
      <rect x="51" y="74" width="18" height="20" fill="#946a4c"/>`,
    head:`<path d="M35 56 C 35 32, 46 24, 60 24 C 74 24, 85 32, 85 56 C 85 76, 76 90, 60 90 C 44 90, 35 76, 35 56 Z" fill="#b08262"/>
      <path d="M33 58 C 30 34, 44 20, 60 20 C 77 20, 90 32, 87 58 C 85 46, 82 40, 78 37 C 70 40, 56 38, 46 33 C 42 38, 38 46, 37 58 Z" fill="#4a3424"/>
      <path d="M34 50 C 34 44, 36 40, 38 38 M86 50 C 86 44, 84 40, 82 38" stroke="#8c8680" stroke-width="2.4" fill="none" stroke-linecap="round"/>

function eyes(c, emo){
  const {cx,y,dx}=c.eye, xs=[cx-dx, cx+dx];
  const lid = c.spirit ? "#e8f6f3" : "#2a1d14";
  let open="", closed="";
  for(const [i,ex] of xs.entries()){
    const s = i===0 ? 1 : -1; // 外側の向き
    closed += `<path d="M${ex-5} ${y} Q${ex} ${y+1.8} ${ex+5} ${y}" stroke="${lid}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    if(c.spirit){
      const h = emo==="驚"?3.2: emo==="笑"?1.2: 1.8;
      open += `<path d="M${ex-5} ${y} Q${ex} ${y-h} ${ex+5} ${y} Q${ex} ${y+h*.7} ${ex-5} ${y} Z" fill="#ffffff" filter="url(#glw)"/>`;
      continue;
    }
    if(emo==="笑"){
      open += `<path d="M${ex-5} ${y+.6} Q${ex} ${y-2.6} ${ex+5} ${y+.6}" stroke="${lid}" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M${ex-3.5} ${y+2.6} Q${ex} ${y+3.6} ${ex+3.5} ${y+2.6}" stroke="${c.skinD}" stroke-width="1" fill="none"/>`;
      continue;
    }
    const up = emo==="驚"?4.2: emo==="悲"?2.4: 3.2, dn = emo==="驚"?3.2:2.2;
    const outerDrop = emo==="悲" ? 1.4 : 0, innerDrop = emo==="怒" ? 1.6 : 0;
    const L=ex-5, R=ex+5;
    const yl = y + (s===1?outerDrop:innerDrop), yr = y + (s===1?innerDrop:outerDrop);
    open += `<path d="M${L} ${yl} Q${ex} ${y-up} ${R} ${yr} Q${ex} ${y+dn} ${L} ${yl} Z" fill="#e6dccc"/>`;
    open += `<circle cx="${ex}" cy="${y+.2}" r="${emo==="驚"?1.9:2.3}" fill="${c.eye.iris}"/><circle cx="${ex}" cy="${y+.2}" r="1" fill="#120c08"/>`;
    open += `<circle cx="${ex+.9}" cy="${y-.8}" r=".55" fill="#fff" opacity=".8"/>`;
    open += `<path d="M${L-.5} ${yl} Q${ex} ${y-up-.6} ${R+.5} ${yr}" stroke="${lid}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  }
  let brow="";
  if(c.brow){
    const by=y-8, lift=emo==="驚"?-2.5:0;
    const [o,i] = emo==="悲" ? [by+1.2,by-2.2] : emo==="怒" ? [by-2,by+1.6] : [by+lift,by+lift-.6];
    brow=`<path d="M${xs[0]-6} ${o} Q${xs[0]-1} ${Math.min(o,i)-1.4} ${xs[0]+4} ${i} M${xs[1]+6} ${o} Q${xs[1]+1} ${Math.min(o,i)-1.4} ${xs[1]-4} ${i}" stroke="${c.brow}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  }
  let tear = emo==="悲" ? `<path d="M${xs[1]+2} ${y+4} q1.2 4 0 6 q-1.2 -2 0 -6 z" fill="#cfe9e4" opacity=".8"/>` : "";
  return `<g class="eo">${open}</g><g class="ec">${closed}</g>${brow}${tear}`;
}

  f.style.left="0"; f.style.top="0";

function burst(x,y,color,n){
  if(RM) return;
  for(let i=0;i<n;i++){
    const b=document.createElement("div"); b.className="burst"; b.style.background=color; b.style.left=x+"px"; b.style.top=y+"px";
    document.body.appendChild(b);
    const a=Math.random()*Math.PI*2, d=40+Math.random()*70;
    b.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*d-4}px,${Math.sin(a)*d-4}px) scale(.2)`,opacity:0}],{duration:700+Math.random()*400,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>b.remove();
  }
}

// ---- 舞う光（場面ごと） ----
const cv=$("fx"), g=cv.getContext("2d"); let fxKind="well", parts=[];
function fxSize(){ const r=cv.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); cv.width=r.width*d; cv.height=r.height*d; g.setTransform(d,0,0,d,0,0); }
addEventListener("resize", fxSize);
function spawn(w,h){
  if(fxKind==="cave") return {x:Math.random()*w, y:-6, vx:(Math.random()-.5)*.3, vy:.25+Math.random()*.3, r:1.5+Math.random()*2, life:1, col:"255,255,255", spin:Math.random()*6};
  if(fxKind==="chamber") return {x:Math.random()*w, y:h+6, vx:(Math.random()-.5)*.2, vy:-(.2+Math.random()*.35), r:1+Math.random()*1.8, life:1, col:"169,214,207"};
  return {x:Math.random()*w, y:h*(.5+Math.random()*.5), vx:(Math.random()-.5)*.25, vy:-(.1+Math.random()*.25), r:1+Math.random()*1.6, life:1, col:"243,200,120"};
}
function fxLoop(t){
  const r=cv.getBoundingClientRect(), w=r.width, h=r.height;
  g.clearRect(0,0,w,h);
  if(parts.length<26 && Math.random()<.15) parts.push(spawn(w,h));
  for(const p of parts){
    p.x+=p.vx+Math.sin((t/900)+p.r*3)*.15; p.y+=p.vy; p.life-=.0025;
    const a=Math.max(0,Math.min(1,p.life))*(.5+.5*Math.sin(t/300+p.r*10));
    g.beginPath();
    if(fxKind==="cave"){ g.ellipse(p.x,p.y,p.r*1.6,p.r*.8,(p.spin+=.02),0,Math.PI*2); }
    else g.arc(p.x,p.y,p.r,0,Math.PI*2);
    g.fillStyle=`rgba(${p.col},${a*.8})`; g.shadowColor=`rgba(${p.col},${a})`; g.shadowBlur=8; g.fill();
  }
  parts=parts.filter(p=>p.life>0 && p.y>-10 && p.y<h+10);
  requestAnimationFrame(fxLoop);
}
if(!RM){ fxSize(); requestAnimationFrame(fxLoop); }

    slotWho[side]=who; el.classList.remove("on");
    el.innerHTML=portrait(who, emo);

  el.classList.toggle("dim", !speaking);

}

const GROQ_MODELS=["qwen/qwen3.8-27b","openai/gpt-oss-20b","openai/gpt-oss-120b"];
function groqKey(){ try{ return localStorage.getItem("tomoshibi-groq-key")||""; }catch(e){ return ""; } }
async function groqSample(prompt, opts){
  const key=groqKey(); if(!key){ const e=new Error("no key"); e.code="not_granted"; throw e; }
  let lastErr=null;
  for(const model of GROQ_MODELS){
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json"},
        body:JSON.stringify({model, messages:[{role:"user",content:prompt}], temperature:0.8, max_tokens:1000}),
        signal: opts && opts.signal
      });
      if(res.status===401||res.status===403){ const e=new Error("bad key"); e.code="not_granted"; throw e; }
      if(!res.ok) throw new Error("groq "+res.status);
      const data=await res.json();
      const text=data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!text) throw new Error("empty");
      return {text};
    }catch(e){ if(e && e.code==="not_granted") throw e; if(e && e.name==="AbortError") throw e; lastErr=e; }
  }
  throw lastErr||new Error("groq failed");
}
function proxyAvailable(){ return location.protocol.indexOf("http")===0 && (location.hostname.slice(-9)==="pages.dev"||location.hostname==="localhost"||location.hostname==="127.0.0.1"); }
async function proxySample(prompt, opts){
  const res=await fetch("/api/groq",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt}),signal:opts&&opts.signal});
  if(!res.ok) throw new Error("proxy "+res.status);
  const data=await res.json(); if(!data||!data.text) throw new Error("empty");
  return {text:data.text};
}
async function aiSample(prompt, opts){
  if(proxyAvailable()){
    try{ return await proxySample(prompt, opts); }
    catch(e){ if(e&&e.name==="AbortError") throw e; }
  }
  return groqSample(prompt, opts);
}
let sample=null, offline=false;
function initAI(){
  if(proxyAvailable()||groqKey()){ sample=aiSample; offline=false; } else { sample=null; offline=true; }

function makeDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  const rec=new SR(); rec.lang="ja-JP"; rec.interimResults=false; rec.continuous=false;
  let finalCb=null, stateCb=null;
  rec.onresult=e=>{ let t=""; for(const r of e.results) t+=r[0].transcript; if(finalCb&&t) finalCb({text:t}); };
  rec.onend=()=>{ if(stateCb) stateCb({state:"idle"}); };
  rec.onerror=()=>{ if(stateCb) stateCb({state:"idle"}); };
  return {
    onFinal(cb){ finalCb=cb; },
    onState(cb){ stateCb=cb; },
    async start(){ if(stateCb) stateCb({state:"listening"}); rec.start(); },
    async stop(){ try{ rec.stop(); }catch(e){} }
  };
}

  }
  if(S.act===0){
    if(/マルタ|ばあ|老婆|薬師|祖母/.test(action)&&!S.rels.has("marta-gren")){ r.reveal="marta-gren"; MA("聞くならこの男に聞きな","怒"); MA("トマスを井戸で死なせた男にね","怒"); G("……","悲"); r.choices=["トマスとは？","靴を調べる","縁を照らす"]; return r; }
    if(/トマス/.test(action)&&!S.rels.has("thomas-elena")){ r.reveal="thomas-elena"; G("ミラの父親だ。エレナの夫","悲"); MA("五年前、この井戸で死んだ","悲"); r.choices=["靴を調べる","縁を照らす","グレンに聞く"]; return r; }
  }
  if(S.act===1 && /奥|壁|骨|調べ|探る/.test(action) && !/岩陰|岩/.test(action) && !S.rels.has("gren-thomas")){
    r.reveal="gren-thomas"; N("壁際に白骨。錆びた短剣が添えてある。"); G("……トマス","悲"); G("俺が縄を離さなければ……","悲");
    r.choices=["グレンを慰める","岩陰を探る","水たまりを覗く"]; return r;
  }
  if(S.act===2 && /トマス/.test(action) && !S.rels.has("marta-thomas")){
    r.reveal="marta-thomas"; r.heart=1; SP("あの人は言ってた。マルタに頼まれたと","悲"); G("……マルタが？","驚"); G("俺は、ずっと……","悲");
    r.choices=["グレンの肩を叩く","子守唄を唄う","精を説得する"]; return r;
  }
  if(S.act===0){
    if(a.exit.re.test(action)){ r.exit=true; if(actClueCount()<2){ G("待て。何も分からんまま降りる気か","怒"); } else { N("縄を梁に結び、縁に足をかける。"); r.mods=[["松明",2]]; if(/二重|確か|結|縄/.test(action)) r.mods.push(["結び目確認",2]); } }
    else if(/靴/.test(action)&&!has("shoe")){ r.clue="shoe"; N("靴から、白い花びらがこぼれた。"); G("その花……井戸の底にしか咲かん","驚"); }
    else if(/足跡|縁|苔|照ら|地面|松明/.test(action)&&!has("steps")){ r.clue="steps"; N("苔に、小さな足跡。井戸の内へ続く。"); G("引きずられた跡がない……自分で？","驚"); }
    else if(/グレン|聞|話|三日|マルタ/.test(action)&&!has("song")){ r.clue="song"; G("母親が死んでから、夜な夜な唄が聞こえる","悲"); G("井戸の底から、エレナの子守唄が","悲"); }
    else { N(action.slice(0,18)+"。霧がふっと揺れた。"); G("……今、それをやるのか","驚"); G("まあいい。井戸を調べよう","笑"); }
    r.choices=[...(actClueCount()+(r.clue?1:0)>=2?["井戸の底へ降りる"]:[]), ...(!has("shoe")&&r.clue!=="shoe"?["靴を調べる"]:[]), ...(!has("steps")&&r.clue!=="steps"?["縁を照らす"]:[]), ...(!has("song")&&r.clue!=="song"?["グレンに聞く"]:[]), "井戸を覗く"].slice(0,3);
  } else if(S.act===1){
    if(a.exit.re.test(action)){ r.exit=true; if(actClueCount()<2){ G("まだだ。この流れは、闇雲に渡れん","怒"); } else { N("流れの前に立つ。水が足を掴みにくる。"); r.mods=[["縄",2]]; if(/縄|結|グレン|手/.test(action)) r.mods.push(["グレンと組む",2]); } }
    else if(/岩|陰|探/.test(action)&&!has("comb")){ r.clue="comb"; N("岩陰に、古い櫛が落ちている。"); G("……俺が、エレナに贈った櫛だ","悲"); }
    else if(/水|覗|鏡/.test(action)&&!has("mirror")){ r.clue="mirror"; N("水面に、女の顔が浮かんだ。"); SP("……だれ？","驚"); G("エレナ……いや、違う。声だけだ","驚"); }
    else if(/花|辿|奥/.test(action)&&!has("flowers")){ r.clue="flowers"; N("花が道のように奥へ続く。甘い香り。"); G("ふぁ……眠くなる匂いだ","普通"); }
    else { N(action.slice(0,18)+"。声が洞窟にこだました。"); G("……おまえさん、変わっとるな","笑"); }
    r.choices=[...(actClueCount()+(r.clue?1:0)>=2?["流れを渡る"]:[]), ...(!has("comb")&&r.clue!=="comb"?["岩陰を探る"]:[]), ...(!has("mirror")&&r.clue!=="mirror"?["水たまりを覗く"]:[]), ...(!has("flowers")&&r.clue!=="flowers"?["花を辿る"]:[])].slice(0,3);
    if(r.choices.length<3) r.choices.push(S.rels.has("gren-thomas")?"耳を澄ます":"奥の壁を調べる");
  } else {
    const t=S.turnsInAct+1;
    if(/剣|短剣|斬|戦|攻/.test(action)){ r.decisive=true; r.approach="戦う"; r.heart=-2; N("短剣を抜く。水の女が振り向いた。"); SP("……あなたも、奪うのね","怒"); }
    else if(/櫛|差し出|渡|代わり|取引/.test(action)){ r.decisive=true; r.approach="取引"; N("櫛を、精へ差し出す。"); r.mods=S.items.includes("comb")?[["エレナの櫛",3]]:[["持たない物",-1]]; }
    else if(t>=2 && /説得|頼|返して|帰/.test(action)){ r.decisive=true; r.approach="説得"; N("精の目を見て、言葉を選ぶ。"); if(/唄|歌/.test(action)) r.mods.push(["子守唄",2]); }
    else if(/唄|歌/.test(action)){ r.heart=2; N("子守唄を、そっと口ずさむ。"); SP("……その唄、あの人の","悲"); }
    else if(/エレナ|寂し|ひとり/.test(action)){ r.heart=1; SP("あの人は、毎晩わたしに話しかけてくれた","悲"); SP("もう誰も、来なくなった","悲"); }
    else if(/ミラ|起こ|揺/.test(action)){ M("……おかあさん、そこにいるの？","普通"); SP("いるわ。ずっと、ここに","笑"); G("ミラ……！","驚"); }
    else { N(action.slice(0,18)+"。"); SP("……ふしぎな人","驚"); SP("あの人も、よく変なことをした","笑"); r.heart=1; }
    r.choices = ["子守唄を唄う", S.items.includes("comb")?"櫛を差し出す":(S.rels.has("marta-thomas")?"エレナの話をする":"トマスのことを聞く"), t>=2?"精を説得する":"ミラを揺り起こす"];
  }
  return r;
}
function scriptedOutcome(kind, outcome, approach){
  const ok=!outcome.includes("失敗");
  if(kind==="exit0") return ok?{beats:[{who:"narr",text:"縄は軋んだが、耐えた。"},{who:"gren",emo:"笑",text:"……ふう。俺の縄は丈夫だろう"}]}:{beats:[{who:"narr",text:"縄が切れ、闇へ落ちた。"},{who:"gren",emo:"驚",text:"おい！生きとるか！"}],hp_change:-1};
  if(kind==="exit1") return ok?{beats:[{who:"narr",text:"冷たい流れを、渡りきった。"},{who:"gren",emo:"悲",text:"……唄が、近い"}]}:{beats:[{who:"narr",text:"足を取られ、流される。"},{who:"gren",emo:"怒",text:"掴まれ！"},{who:"narr",text:"引き上げられ、向こう岸へ。"}],hp_change:-1};
  if(kind==="final"){
    if(!ok) return {beats:[{who:"spirit",emo:"怒",text:"返さない。この子まで、失えない"},{who:"gren",emo:"悲",text:"なら、俺が残る。エレナの代わりに"},{who:"spirit",emo:"驚",text:"……あなたが？"},{who:"mira",emo:"悲",text:"グレンおじさん……？"}]};
    if(approach==="戦う") return {beats:[{who:"narr",text:"刃が水の体を裂いた。"},{who:"spirit",emo:"悲",text:"……また、ひとり"},{who:"mira",emo:"悲",text:"おかあさんの声が、消えちゃった"}]};
    if(approach==="取引") return {beats:[{who:"spirit",emo:"悲",text:"……あの人の、匂いがする"},{who:"narr",text:"精は櫛を抱き、水へ還った。"},{who:"mira",emo:"笑",text:"グレンおじさん、おなかすいた"},{who:"gren",emo:"笑",text:"……帰ったら、スープだな"}]};
    return {beats:[{who:"spirit",emo:"笑",text:"……あの人も、そう言ってくれた"},{who:"spirit",emo:"悲",text:"もう一度だけ、唄わせて"},{who:"mira",emo:"笑",text:"おかあさん、ありがとう"}]};
  }
  return ok?{beats:[{who:"narr",text:"うまくいった。"}]}:{beats:[{who:"narr",text:"しくじった。だが道はある。"}],hp_change:-1};
}

// ================= 進行 =================
function sanitizeBeats(beats){
  const allow=new Set(["narr",...ACTS[S.act].speakers]);
  return (Array.isArray(beats)?beats:[]).filter(b=>b&&b.text).map(b=>({who:allow.has(b.who)?b.who:"narr", emo:EMOS.includes(b.emo)?b.emo:"普通", text:String(b.text).replace(/^「|」$/g,"").slice(0,48), yomi:b.yomi?String(b.yomi).slice(0,60):null})).slice(0,4);
}
function logBeats(beats){ for(const b of beats) S.log.push({who:b.who==="narr"?"情景":CAST[b.who].name, text:b.text}); }
function cleanMods(m){ return (Array.isArray(m)?m:[]).filter(x=>Array.isArray(x)&&x.length===2).slice(0,3).map(x=>[String(x[0]).slice(0,10), Math.max(-2,Math.min(3,parseInt(x[1])||0))]).filter(x=>x[1]!==0); }
function damage(n){ if(n<0){ const before=S.hp; S.hp=Math.max(1,S.hp+Math.max(-2,n)); if(S.hp<before) hurt(); } }

async function act(action){
  action=String(action||"").trim(); if(!action||S.busy) return;
  $("freeInput").value=""; stopVoice();
  S.busy=true; hideChoices();
  $("nextMark").hidden=true;
  showBeat({who:"you", emo:"普通", text:action.slice(0,40)}, null);
  thinking(true);
  let r;
  try{ const pf=takePrefetch(action); r= offline ? scripted(action) : ((pf && await pf) || await askTurn(action)); }
  catch(e){ if(e&&e.code==="not_granted"){ offline=true; r=scripted(action); } else { r=null; } }
  thinking(false); if(typing) typing.finish(); S.busy=false;
  if(!r){ $("line").textContent="語り部の声が途切れた。もう一度。"; $("who").textContent=""; showChoices(ACTS[S.act].choices); return; }
  S.log.push({who:"プレイヤー", text:action});
  S.turnsInAct++;
  const a=ACTS[S.act];
  let notes=[], gotClue=null, heartUp=false;
  if(r.clue && CLUES[r.clue] && CLUES[r.clue].act===S.act && !S.clues.includes(r.clue)){
    S.clues.push(r.clue); gotClue=r.clue; notes.push("手がかり："+CLUES[r.clue].name);
    if(revealRel(CLUES[r.clue].rel)) notes.push("関係が判明");
    if(r.clue==="comb" && !S.items.includes("comb")) S.items.push("comb");
  }
  if(r.reveal){ const rel=RELS.find(x=>x.id===r.reveal); if(rel && rel.fact && (rel.act??9)<=S.act && revealRel(rel.id)) notes.push("関係が判明"); }
  if(a.final){
    const h=Math.max(-2,Math.min(2,parseInt(r.heart)||0));
    if(h){ const before=S.heart; S.heart=Math.max(0,Math.min(5,S.heart+h)); heartUp=S.heart>before; notes.push(h>0?"精の心が揺れた":"精の心が閉じた"); }
  }
  damage(typeof r.hp_change==="number"?r.hp_change:0);
  let beats=sanitizeBeats(r.beats); if(!beats.length) beats=[{who:"narr",text:"……"}];
  logBeats(beats);
  renderHud(heartUp);
  if(gotClue==="comb") renderItems("comb");
  if(notes.length){ ftoast(notes.join("　")); if(navigator.vibrate) navigator.vibrate(30); }
  if(gotClue) flyClue(gotClue);
  if(heartUp){ const st=$("stage").getBoundingClientRect(); burst(st.right-60, st.top+st.height/2, "#a9d6cf", 12); }

  const exitReady = !a.final && r.exit && actClueCount()>=2;
  const checkReady = !a.final && !exitReady && r.check && r.check.target;
  const finalReady = a.final && r.decisive && ["説得","取引","戦う"].includes(r.approach);
  play(beats, ()=>{
    if(exitReady){
      const mods=cleanMods(r.mods); if(S.hp<3 && !mods.some(m=>m[1]<0)) mods.push(["傷",-1]);
      showGo("ダイスへ", ()=>openDice({what:a.exit.what, target:a.exit.target}, mods, "exit"+S.act));
    } else if(finalReady){
      const target = r.approach==="説得"?14 : r.approach==="取引"?13 : 14;
      const mods=cleanMods(r.mods);
      if(r.approach!=="戦う"){ const hv=S.heart-2; if(hv) mods.unshift(["精の心", hv]); }
      else mods.unshift(["短剣",2]);
      showGo("ダイスへ", ()=>openDice({what:r.approach==="戦う"?"精と戦う":r.approach==="取引"?"精と取引する":"精を説得する", target}, mods, "final", r.approach));
    } else if(checkReady){
      showGo("ダイスへ", ()=>openDice({what:String(r.check.what||"判定").slice(0,14), target:Math.min(16,Math.max(8,parseInt(r.check.target)||12))}, cleanMods(r.mods), "check"));
    } else {
      let ch=(Array.isArray(r.choices)?r.choices:[]).filter(Boolean);
      if(ch.length<2) ch=scripted("").choices;
      showChoices(ch);
    }
  });
}

// ================= ダイス =================
let D=null;
function openDice(check, mods, kind, approach){
  stopVoice();
  D={check,mods,kind,approach,rolled:false};
  D.pre = (offline||!sample) ? null : { ok:askOutcome(check,"成功",kind,approach).catch(()=>null), ng:askOutcome(check,"失敗",kind,approach).catch(()=>null) };
  $("diceWhat").textContent=check.what; $("diceTarget").textContent=check.target;
  const box=$("diceMods"); box.innerHTML="";
  mods.forEach(m=>{ const d=document.createElement("div"); d.className="mod"+(m[1]<0?" neg":""); d.textContent=m[0]+" "+(m[1]>0?"＋":"−")+Math.abs(m[1]); box.appendChild(d); });
  $("dieNum").textContent="?"; $("verdict").textContent="タップして振る"; $("verdict").className="verdict";
  $("diceSum").textContent=""; $("diceNext").hidden=true; $("diceNext").disabled=false; $("diceNext").textContent="続きを見る"; $("dieGlow").style.fillOpacity=".1";
  $("dieBtn").className="die idle";
  $("diceOv").hidden=false;
}
$("dieBtn").onclick=()=>{
  if(!D||D.rolled) return; D.rolled=true;
  const die=$("dieBtn"); die.className="die rolling";
  const roll=1+Math.floor(Math.random()*20), modSum=D.mods.reduce((a,m)=>a+m[1],0), total=roll+modSum, t=D.check.target;
  const outcome= roll===20?"大成功": roll===1?"大失敗": total>=t?"成功":"失敗";
  D.result={roll,total,outcome};
  D.p = offline ? Promise.resolve(scriptedOutcome(D.kind,outcome,D.approach)) :
    ((D.pre && D.pre[outcome.includes("失敗")?"ng":"ok"]) || Promise.resolve(null))
      .then(r=> r || askOutcome(D.check,outcome,D.kind,D.approach))
      .catch(()=>scriptedOutcome(D.kind,outcome,D.approach));
  let n=0, delay=50;
  const tick=()=>{ $("dieNum").textContent=1+Math.floor(Math.random()*20); if(navigator.vibrate) navigator.vibrate(6); n++;
    if(n<22){ delay*=1.09; setTimeout(tick,delay); } else land(); };
  setTimeout(tick, RM?0:delay);
  function land(){
    die.className="die land";
    $("dieNum").textContent=roll; if(navigator.vibrate) navigator.vibrate([40,30,90]);
    setTimeout(()=>{
      const v=$("verdict"); v.textContent=outcome;
      v.className="verdict show "+(outcome==="大成功"?"crit":outcome.includes("失敗")?"ng":"ok");
      $("dieGlow").style.fillOpacity=outcome.includes("失敗")?".04":".4";
      const r=die.getBoundingClientRect();
      if(!outcome.includes("失敗")) burst(r.left+r.width/2, r.top+r.height/2, outcome==="大成功"?"#a9d6cf":"#f3c878", outcome==="大成功"?36:20);
      $("diceSum").textContent=`${roll} ${modSum>=0?"＋":"−"} ${Math.abs(modSum)} ＝ ${total}`;
      $("diceNext").hidden=false;
    },500);
  }
};
$("diceNext").onclick=async()=>{
  const btn=$("diceNext"); btn.disabled=true; btn.textContent="語り部が考えている";
  const r=await D.p; $("diceOv").hidden=true;
  const {roll,outcome}=D.result;
  damage(typeof r.hp_change==="number"?r.hp_change:(outcome.includes("失敗")&&D.kind.startsWith("exit")?-1:0));
  let beats=sanitizeBeats(r.beats); if(!beats.length) beats=scriptedOutcome(D.kind,outcome,D.approach).beats;
  S.log.push({who:"判定", text:D.check.what+"："+outcome}); logBeats(beats); renderHud();
  const kind=D.kind, approach=D.approach;
  play(beats, ()=>{
    if(kind==="exit0"||kind==="exit1") showGo("次の幕へ", ()=>nextAct());
    else if(kind==="final"){
      const ok=!outcome.includes("失敗"), key= ok?approach:"失敗", end=ENDINGS[key];
      showGo("結末へ", ()=>showEnding(key, end));
    } else {
      let ch=(Array.isArray(r.choices)?r.choices:[]).filter(Boolean); if(ch.length<2) ch=scripted("").choices; showChoices(ch);
    }
  });
};

// ================= 幕の進行 =================
function inkTitle(el, text){ el.innerHTML=""; [...text].forEach((ch,i)=>{ const s=document.createElement("span"); s.textContent=ch; s.style.animationDelay=(i*0.12)+"s"; el.appendChild(s); }); }
function nextAct(){ S.act++; S.turnsInAct=0; showActCard(); }
function showActCard(){ const a=ACTS[S.act]; $("actNum").textContent=a.num; inkTitle($("actName"), a.name); $("actOv").hidden=false; }
$("actGo").onclick=()=>{ $("actOv").hidden=true; startAct(); };
function startAct(){
  const a=ACTS[S.act];
  if(S.act===2){ S.met.spirit=true; S.heart=1+(S.clues.includes("song")?1:0)+(S.clues.includes("mirror")?1:0); $("mapBadge").classList.add("on"); }
  clearActors(); setScene(S.act>0);
  const openBeats=a.open.map(b=>({...b, emo: b.who==="gren"&&S.act===2?"驚": b.who==="gren"&&S.act===1?"笑": b.who==="spirit"?"悲":"普通"}));
  logBeats(openBeats);
  setTimeout(()=>play(openBeats, ()=>showChoices(a.choices)), S.act>0&&!RM?800:0);
}
function getEnds(){ try{ return JSON.parse(localStorage.getItem("tomoshibi-ends")||"[]"); }catch(e){ return []; } }
function saveEnd(k){ try{ const e=getEnds(); if(!e.includes(k)){ e.push(k); localStorage.setItem("tomoshibi-ends", JSON.stringify(e)); } }catch(e){} }
function renderEnds(el, fresh){
  const got=getEnds(); el.innerHTML="";
  for(const [k,e] of Object.entries(ENDINGS)){ const d=document.createElement("div"); d.className="endslot"+(got.includes(k)?" got":""); d.textContent=got.includes(k)?e.title:"？？？"; if(k===fresh) d.style.animation="pop .8s ease"; el.appendChild(d); }
}
function showEnding(key, end){
  saveEnd(key);
  inkTitle($("endTitle"), end.title); $("endDesc").textContent=end.line;
  const emo = key==="戦う"?"悲": key==="失敗"?"悲":"笑";
  $("endCast").innerHTML=end.cast.map(id=>`<div>${portrait(id, id==="gren"&&key==="失敗"?"笑":emo)}</div>`).join("");
  renderEnds($("endEnds"), key);
  $("endOv").hidden=false;
}
$("endMap").onclick=()=>{ openMap(); };
$("againBtn").onclick=()=>{ $("endOv").hidden=true; begin(); };

// ================= 入力・開始 =================
$("freeForm").addEventListener("submit", e=>{ e.preventDefault(); act($("freeInput").value); });
function begin(){ resetState(); $("mapBadge").classList.remove("on"); showActCard(); }
$("titleCast").innerHTML=[["you","笑"],["gren","普通"],["mira","笑"]].map(([id,e])=>`<div>${portrait(id,e)}</div>`).join("");
inkTitle($("titleText"), "灯火の語り部");
renderEnds($("titleEnds"));
try{ const ki=$("groqKey"); if(ki) ki.value=groqKey(); if(proxyAvailable()){ const kb=$("keyBlock"); if(kb) kb.style.display="none"; } }catch(e){}
$("startBtn").onclick=async()=>{
  const btn=$("startBtn"); if(btn.disabled) return;
  btn.disabled=true; btn.textContent="準備中";
  try{
    const v=($("groqKey")&&$("groqKey").value||"").trim();
    try{ if(v) localStorage.setItem("tomoshibi-groq-key", v); else localStorage.removeItem("tomoshibi-groq-key"); }catch(e){}
  }catch(e){}
  initAI();
  btn.disabled=false; btn.textContent="はじめる";
  $("titleOv").hidden=true; begin();
};
setScene(false); hideChoices();

</script>
