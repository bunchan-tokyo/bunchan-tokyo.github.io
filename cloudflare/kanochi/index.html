<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>完落ち — 取調室の刑事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#c4c8c5; --wall2:#a7adaa; --ink:#1c2126; --muted:#4f585f;
  --paper:#e7d7a9; --paper-ink:#3a2f17; --stamp:#b3261e; --lamp:rgba(255,242,205,.7);
  --det:#26405c; --det-ink:#f3f5f7; --panel:#d9dcd9; --line:rgba(0,0,0,.18); --info:#2c5d8a; --hint:#2a557f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#23292e; --wall2:#15191c; --ink:#e8eaeb; --muted:#9aa3a9;
    --paper:#cfbd88; --paper-ink:#2c2411; --stamp:#e5493d; --lamp:rgba(255,236,180,.25);
    --det:#2f4c6c; --det-ink:#f3f5f7; --panel:#1b2024; --line:rgba(255,255,255,.14); --info:#7db4e6; --hint:#2a557f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --wall:#23292e; --wall2:#15191c; --ink:#e8eaeb; --muted:#9aa3a9;
  --paper:#cfbd88; --paper-ink:#2c2411; --stamp:#e5493d; --lamp:rgba(255,236,180,.25);
  --det:#2f4c6c; --det-ink:#f3f5f7; --panel:#1b2024; --line:rgba(255,255,255,.14); --info:#7db4e6; --hint:#2a557f;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--wall2);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(var(--wall),var(--wall2));position:relative;overflow:hidden}

/* 上部 */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.case{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snd{background:none;border:1px solid var(--line);border-radius:6px;font-size:12px;padding:1px 8px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.clock b{color:var(--ink);font-size:16px}

/* 容疑者 */
.suspect{position:relative;height:244px;flex:none;display:flex;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,transparent 25%,rgba(0,0,0,.6) 85%),#121416}
.fig{height:100%;position:relative;z-index:1;transform-origin:50% 100%;animation:breathe var(--br,4.6s) ease-in-out infinite;transition:translate .9s ease,rotate .9s ease}
.fig svg{height:100%;display:block}
@keyframes breathe{50%{transform:scale(1.012) translateY(-1px)}}
.fig.zoom{animation:breathe var(--br,4.6s) ease-in-out infinite,zoomS .9s ease}
@keyframes zoomS{0%{scale:1}14%{scale:1.13}72%{scale:1.13}100%{scale:1}}
.flick{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.suspect[data-heat="1"] .flick{animation:flick 5s infinite}
.suspect[data-heat="2"] .flick{animation:flick 2.1s infinite}
@keyframes flick{0%,100%{opacity:0}6%{opacity:.5}8%{opacity:.05}10%{opacity:.4}12%{opacity:0}55%{opacity:0}57%{opacity:.35}59%{opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.flash.on{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.nameplate{position:absolute;left:12px;top:8px;z-index:4;font-size:12px;color:#a9b0b5;line-height:1.4}
.nameplate b{display:block;font-family:"Shippori Mincho B1",serif;font-size:17px;color:#eceeef}
.status{position:absolute;right:10px;top:8px;z-index:4;width:134px;text-align:right}
.gauge{font-size:10px;color:#a9b0b5;margin-top:5px}
.gauge .bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin-top:3px}
.gauge .fill{height:100%;width:10%;background:var(--stamp);transition:width .6s}

/* 会話 */
.log{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 6px;display:flex;flex-direction:column;gap:10px}
.say{max-width:86%;padding:8px 12px;border-radius:12px;white-space:pre-wrap}
.say.sus{align-self:flex-start;font-family:"Shippori Mincho B1",serif;font-weight:500;font-size:16px;background:var(--panel);border-top-left-radius:3px}
.say.det{align-self:flex-end;background:var(--det);color:var(--det-ink);border-top-right-radius:3px}
.say.sys{align-self:center;font-size:12px;color:var(--muted);text-align:center;padding:2px 8px}
.say.report{align-self:center;max-width:92%;background:var(--paper);color:var(--paper-ink);font-size:13px;border-radius:8px;padding:7px 12px;border-left:4px solid var(--info)}
.say.wait{opacity:.6}
.stampline{align-self:center;font-family:"Shippori Mincho B1",serif;font-weight:800;color:var(--stamp);border:3px solid var(--stamp);padding:2px 14px;font-size:22px;transform:rotate(-6deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
.stampline.small{font-size:15px;border-width:2px;padding:1px 10px}
@keyframes stamp{from{transform:scale(2.4) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}

/* 証言メモ */
.memo{flex:none;padding:6px 14px 4px;border-top:1px solid var(--line)}
.memo h2{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;min-height:34px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:13px;max-width:240px;text-align:left}
.chip.broken{text-decoration:line-through;text-decoration-color:var(--stamp);color:var(--muted)}
.chip.vague{border-style:dashed}
.chip.pinned{border-color:var(--stamp)}
.chip .tag{font-size:10px;margin-right:6px;padding:0 5px;border-radius:3px;border:1px solid currentColor;opacity:.75;white-space:nowrap}
.chip.pinned .tag{color:var(--stamp);opacity:1}
.chip .tag.chk{color:var(--info);opacity:1}
.chips.picking .chip:not(.broken){border-color:var(--stamp);box-shadow:0 0 0 2px color-mix(in srgb,var(--stamp) 35%,transparent);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--stamp) 15%,transparent)}}
.empty{font-size:12px;color:var(--muted);align-self:center}

/* 入力 */
.ask{flex:none;padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.hintbar{display:none;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;background:var(--hint);color:#fff;border-radius:10px;padding:8px 6px 8px 12px}
.hintbar span{flex:1}
.hintbar button{background:none;border:none;color:#fff;font-size:18px;line-height:1;padding:0 6px;opacity:.8}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 2px}
.quick button{flex:none;max-width:270px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:14px;padding:3px 11px;font-size:12px;line-height:1.4;color:var(--muted)}
.quick button.wait{border-style:dashed;color:var(--ink)}
.quick button.qpin{border-color:var(--stamp);color:var(--ink);background:color-mix(in srgb,var(--stamp) 12%,transparent)}
.quick button:disabled{opacity:.5}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.btn{border:none;border-radius:10px;padding:0 11px;font-weight:700;white-space:nowrap}
.btn.send{background:var(--det);color:var(--det-ink)}
.btn.ev{background:var(--paper);color:var(--paper-ink)}
.btn.chk{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.dot{display:none;width:8px;height:8px;border-radius:50%;background:var(--stamp);margin-left:4px;vertical-align:middle}
.dot.on{display:inline-block}
.glow{animation:glow 1.1s ease-in-out infinite;outline:2px solid var(--stamp);outline-offset:1px}
@keyframes glow{50%{outline-color:transparent}}
.pickbar{display:none;align-items:center;gap:8px;font-size:13px;background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:8px 12px}
.pickbar.on{display:flex}
.pickbar span{flex:1}
.pickbar button{background:none;border:1px solid var(--paper-ink);border-radius:6px;padding:2px 10px;color:var(--paper-ink)}
.finalbtn{display:none;height:52px;border:none;border-radius:12px;background:var(--stamp);color:#fff;font-weight:700;font-size:16px}
.finalbtn:disabled{opacity:.5}
.ask.final .quick,.ask.final .row,.ask.final .pickbar,.ask.final .hintbar{display:none!important}
.ask.final .finalbtn{display:block}

/* シート（証拠・裏取り・筋書き） */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.folder{width:100%;max-height:82%;overflow-y:auto;background:var(--paper);color:var(--paper-ink);border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.folder h3{font-family:"Shippori Mincho B1",serif;margin:0 0 2px;font-size:18px}
.folder p.hint{margin:0 0 10px;font-size:12px;opacity:.8}
.ev-card{display:block;width:100%;text-align:left;background:rgba(255,255,255,.35);border:1px solid rgba(0,0,0,.15);border-radius:8px;padding:9px 11px;margin-bottom:8px;color:var(--paper-ink)}
.ev-card:disabled{opacity:.55}
.ev-card b{display:block;font-size:14px}
.ev-card small{font-size:12.5px;line-height:1.5;display:block;opacity:.85}
.ev-card .new{display:inline-block;margin-left:6px;font-size:10px;padding:0 6px;border-radius:3px;background:var(--stamp);color:#fff;vertical-align:middle}
.asm h4{margin:12px 0 6px;font-size:14px;font-family:"Shippori Mincho B1",serif}
.opt{display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 11px;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.3);border-radius:8px;color:var(--paper-ink);font-size:13.5px;line-height:1.5}
.opt.sel{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.asm details{margin-top:12px;font-size:12.5px}
.asm summary{cursor:pointer;font-weight:700}
.asm details p{margin:6px 0;line-height:1.5}
.asm .go{margin-top:12px;width:100%;height:46px;border:none;border-radius:10px;background:var(--stamp);color:#fff;font-weight:700;font-size:15px}
.asm .go:disabled{opacity:.45}

/* 表紙・結末 */
.cover{position:absolute;inset:0;z-index:8;background:var(--wall2);display:flex;flex-direction:column;overflow-y:auto;padding:26px 22px}
.cover.hide{display:none}
.cover h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:30px;line-height:1.3;margin:10px 0 4px}
.cover .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.cover .brief{font-size:14.5px;line-height:1.8;flex:1}
.cover .brief p{margin:0 0 10px}
.cover .start{margin-top:16px;height:50px;font-size:16px;background:var(--stamp);color:#fff;border:none;border-radius:12px;font-weight:700;flex:none}
.cover .back{margin-top:8px;height:40px;background:none;border:none;color:var(--muted);flex:none}
.cover .confess{font-family:"Shippori Mincho B1",serif;font-size:17px;line-height:1.9;white-space:pre-wrap}
.cover .rank{font-family:"Shippori Mincho B1",serif;font-size:22px;font-weight:800;margin:8px 0 0}
.cases{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.case-card{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px}
.case-card b{display:block;font-family:"Shippori Mincho B1",serif;font-size:19px}
.case-card span{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.note{font-size:12.5px;color:var(--muted)}


/* 取調室の切り替え（複数犯） */
.tabs{display:none;gap:6px;padding:0 14px 6px;overflow-x:auto}
.tabs.on{display:flex}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab.cur{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.tab .m{display:inline-block;width:26px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.tab .m i{display:block;height:100%;background:var(--stamp)}
.tab .x{font-size:10px;color:var(--stamp)}
.tab:disabled{opacity:.5}
.folder h4.sec{margin:14px 0 6px;font-size:13px}

/* 会話は直近だけ表示（全部は「記録」で） */
.say.old,.stampline.old{display:none}
.say.sus{font-size:17px}

/* 突きつけのカットイン */
.cutin{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;overflow:hidden;background:rgba(10,8,6,.8)}
.cutin.on{display:flex}
.cutin .lines{position:absolute;left:-20%;top:-20%;width:140%;height:140%;animation:spin 5s linear infinite}
.cutin .lines path{fill:#fff}
.cutin.hit .lines path{fill:#ffd9d2}
@keyframes spin{to{transform:rotate(10deg)}}
.cutin .say{position:absolute;top:14%;left:0;right:0;text-align:center;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:32px;line-height:1.3;color:#fff;text-shadow:0 3px 0 #b3261e,0 0 18px rgba(0,0,0,.9);padding:0 16px;animation:sayIn .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes sayIn{from{transform:translateX(-60%) skewX(-12deg);opacity:0}to{transform:none;opacity:1}}
.cutin .item{width:150px;height:150px;background:#e7d7a9;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0}
.cutin .item svg{width:112px;height:112px}
.cutin .item.slam{animation:slam .38s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes slam{0%{transform:scale(3.2) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.cutin .item.fizzle{animation:fizzle .6s ease forwards}
@keyframes fizzle{0%{transform:rotate(-4deg);opacity:1}100%{transform:translateY(140px) rotate(28deg) scale(.7);opacity:0}}
.cutin .item.deflect{animation:deflect .6s ease forwards}
@keyframes deflect{0%{transform:rotate(-4deg);opacity:1}100%{transform:translateX(240px) rotate(32deg);opacity:0}}
.cutin .bigwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cutin .big{position:relative;white-space:nowrap;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:92px;line-height:1.1;color:#e5493d;border:8px solid #e5493d;padding:0 20px;border-radius:8px;opacity:0;background:rgba(20,10,8,.35)}
.cutin .big.on{animation:bigStamp .3s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes bigStamp{from{transform:scale(3) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(-10deg);opacity:1}}
.cutin .sub{position:absolute;bottom:16%;left:0;right:0;text-align:center;font-family:"Shippori Mincho B1",serif;font-size:21px;color:#f2ede4;padding:0 18px;opacity:0}
.cutin .sub.on{animation:fadeUp .3s ease forwards}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.cutin .steam{animation:steam 1.1s ease-in-out infinite}
@keyframes steam{50%{transform:translateY(-4px);opacity:.4}}
.app.quake{animation:quake .45s}
@keyframes quake{10%{transform:translate(-8px,4px)}25%{transform:translate(7px,-5px)}40%{transform:translate(-5px,3px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}

/* 証拠品 */
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ev-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:rgba(255,255,255,.42);border:1px solid rgba(0,0,0,.15);border-radius:10px;color:var(--paper-ink);font-size:11.5px;line-height:1.3;text-align:center;position:relative}
.ev-tile svg{width:46px;height:46px}
.ev-tile .new{position:absolute;top:4px;right:4px;font-size:9px;padding:0 5px;border-radius:3px;background:var(--stamp);color:#fff}
.ev-tile.talk{background:rgba(255,248,230,.6)}
.ev-back{background:none;border:none;color:var(--paper-ink);font-size:13px;padding:0;margin-bottom:4px}
.ev-big{width:124px;height:124px;margin:4px auto 8px;background:rgba(255,255,255,.5);border-radius:18px;display:flex;align-items:center;justify-content:center;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.ev-big svg{width:96px;height:96px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.folder h3.c{text-align:center}
.ev-detail{font-size:14px;line-height:1.75;margin:6px 0 14px}
.ev-present{width:100%;height:50px;border:none;border-radius:10px;background:var(--stamp);color:#fff;font-weight:700;font-size:16px}
.toast{position:absolute;left:50%;bottom:160px;z-index:6;display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--paper-ink);padding:8px 14px 8px 8px;border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.45);font-weight:700;font-size:14px;white-space:nowrap;animation:toast 2s ease forwards;pointer-events:none}
.toast svg{width:40px;height:40px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
.quick button.food{border-color:#c9a24a;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.cutin .item,.cutin .big.on,.cutin .sub.on{opacity:1;animation:none}.app.quake,.cutin .lines,.toast,.ev-big{animation:none}}


/* ===== 取調室の舞台 ===== */
.lamp{position:absolute;top:0;left:50%;width:0;height:0;transform-origin:50% 0;animation:sway 7s ease-in-out infinite;pointer-events:none}
.lamp.cone{z-index:0}
.lamp.cone i{position:absolute;top:16px;left:-170px;width:340px;height:250px;background:radial-gradient(ellipse at 50% 0%,var(--lamp),transparent 66%)}
.lamp.shade{z-index:2}
.lamp.shade i{position:absolute;top:0;left:-1px;width:2px;height:12px;background:#0b0c0d}
.lamp.shade b{position:absolute;top:11px;left:-24px;width:48px;height:13px;background:linear-gradient(#3a3f44,#1c1f22);border-radius:6px 6px 16px 16px;box-shadow:0 5px 14px 3px rgba(255,236,180,.35)}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.lamp.swing{animation:swing 1.8s ease-out,sway 7s ease-in-out 1.8s infinite}
@keyframes swing{0%{transform:rotate(-1.6deg)}12%{transform:rotate(11deg)}32%{transform:rotate(-8deg)}52%{transform:rotate(5deg)}72%{transform:rotate(-3deg)}100%{transform:rotate(-1.6deg)}}
.desk{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:2;background:linear-gradient(#6a655c,#3f3c37);border-top:2px solid #857f74;box-shadow:0 -8px 14px rgba(0,0,0,.35)}
.trophies{position:absolute;left:8px;bottom:4px;display:flex;gap:3px}
.tro{width:22px;height:22px;background:#e7d7a9;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.5);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.tro svg{width:100%;height:100%}
.tro:nth-child(odd){transform:rotate(-7deg)}.tro:nth-child(even){transform:rotate(6deg)}
.rec{position:absolute;right:10px;bottom:7px;font-size:9px;letter-spacing:.05em;color:#c9c5bb;display:flex;align-items:center;gap:4px;background:#17191b;padding:1px 6px;border-radius:3px}
.rec i{width:6px;height:6px;border-radius:50%;background:#e5493d;animation:recb 1.6s steps(2) infinite}
@keyframes recb{50%{opacity:.15}}
#hands{position:absolute;left:50%;bottom:1px;width:132px;height:36px;margin-left:-66px;z-index:3;overflow:visible}
#hands .hL,#hands .hR{transition:transform .8s ease}
.suspect[data-heat="1"] #hands{animation:jit .22s linear infinite}
.suspect[data-heat="2"] #hands{animation:jit .11s linear infinite}
.suspect[data-heat="2"] #hands .hL{transform:translateX(9px)}
.suspect[data-heat="2"] #hands .hR{transform:translateX(-9px)}
@keyframes jit{50%{transform:translate(.9px,.5px)}}
.suspect[data-heat="2"] .fig{translate:0 5px;rotate:1.2deg}
.suspect.fallen .fig{translate:0 16px;rotate:3.5deg}
.suspect.fallen{filter:saturate(.55)}
.locks{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:10px;color:#a9b0b5}
.lk{width:15px;height:17px;flex:none}
.lk path{fill:none;stroke:#aab1b6;stroke-width:2}
.lk rect{fill:#aab1b6}
.lk circle{fill:#15191c}
.lk.hidden path,.lk.hidden rect{fill:none;stroke:#646b71;stroke-width:1.2;stroke-dasharray:2 2}
.lk.hidden circle{fill:none}
.lk.pin path{stroke:var(--stamp)}.lk.pin rect{fill:var(--stamp)}
.lk.pin{filter:drop-shadow(0 0 4px var(--stamp))}
.lk.open path{stroke:#4a5156}.lk.open rect{fill:#4a5156}
.lk.open .x{stroke:var(--stamp);stroke-width:1.6}
.lk.bust{animation:bust .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes bust{0%{transform:scale(1)}25%{transform:scale(2.2) rotate(-25deg)}100%{transform:none}}
#face .blink{opacity:0;animation:blink var(--bl,5s) infinite}
@keyframes blink{0%,93%{opacity:0}95%,97.5%{opacity:1}100%{opacity:0}}
.suspect[data-heat="2"] #face .blink{animation-duration:2.1s}
#face.tell .pupil{animation:dart 1s ease-in-out}
@keyframes dart{18%{translate:-3.2px 0}42%{translate:3.2px 0}66%{translate:-2.2px 0}100%{translate:0 0}}
#face.tell .sweat.s1{opacity:1}
.clock.low b{color:var(--stamp);animation:glow2 1s steps(2) infinite}
@keyframes glow2{50%{opacity:.45}}
.quick button.slam{border-color:var(--stamp);color:var(--ink)}

/* 幕開け */
.intro{position:absolute;inset:0;z-index:9;background:#050607;color:#e9e6df;display:none;flex-direction:column;justify-content:center;gap:10px;padding:0 32px;font-family:"Shippori Mincho B1",serif;font-size:20px;letter-spacing:.08em}
.intro.on{display:flex}
.intro p{margin:0;min-height:1.6em}
.intro.out{animation:introOut .65s ease forwards}
@keyframes introOut{to{opacity:0}}

/* 供述調書（組み立て・結末） */
.folder.chosho{background:#f3ecd9;color:#2b2416;background-image:repeating-linear-gradient(transparent 0 31px,rgba(43,36,22,.12) 31px 32px)}
.sentence{font-family:"Shippori Mincho B1",serif;font-size:17px;line-height:32px;margin:6px 0 10px}
.blank{color:#8a1f1a;background:rgba(179,38,30,.08);border-bottom:2px dashed #b3261e;border-radius:3px;padding:1px 4px;margin:0 2px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.blank.filled{color:#2b2416;background:rgba(43,36,22,.07);border-bottom:2px solid #2b2416}
.blank.cur{outline:2px solid #b3261e}
.optbox{min-height:8px}
.paper{background:#f3ecd9;color:#2b2416;border-radius:6px;padding:18px 18px 22px;position:relative;box-shadow:0 14px 30px rgba(0,0,0,.45);background-image:repeating-linear-gradient(transparent 0 29px,rgba(43,36,22,.1) 29px 30px);font-family:"Shippori Mincho B1",serif;overflow:hidden}
.paper .p-head{font-size:24px;font-weight:800;letter-spacing:.3em;text-align:center;margin:0 0 2px}
.paper .p-case{text-align:center;font-size:13px;opacity:.75;margin:0 0 10px}
.paper .p-body{font-size:16px;line-height:30px;white-space:pre-wrap;margin:0}
.paper .p-sign{margin:14px 0 0;text-align:right;font-size:15px;line-height:30px}
.paper .thumb{display:inline-block;width:26px;height:32px;border-radius:50%;vertical-align:middle;margin-left:8px;background:repeating-radial-gradient(ellipse at 50% 60%,rgba(179,38,30,.75) 0 1.5px,transparent 1.5px 3.5px);animation:pop .5s .5s cubic-bezier(.2,1.6,.4,1) both}
.paper .p-stats{font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;opacity:.75;margin:10px 0 0;line-height:1.6}
.paper .p-stamp{position:absolute;right:14px;top:10px;font-size:30px;font-weight:800;color:#b3261e;border:4px solid #b3261e;padding:0 10px;border-radius:4px;transform:rotate(9deg);animation:bigStamp .35s .2s cubic-bezier(.2,1.7,.4,1) both;--r:9deg}
.paper .p-stamp.gray{color:#55606b;border-color:#55606b}
.hanko{width:92px;height:92px;border-radius:50%;border:4px solid #b3261e;color:#b3261e;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px auto 0;transform:rotate(-8deg);animation:pop .5s .9s cubic-bezier(.2,1.6,.4,1) both;font-family:"Shippori Mincho B1",serif}
.hanko b{font-size:40px;line-height:1}
.hanko span{font-size:12px;letter-spacing:.2em;margin-top:2px}

/* 事件ファイル */
.case-card{display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.case-card .th{flex:none;width:58px;height:64px;border-radius:8px;background:radial-gradient(ellipse at 50% 0%,#3a3a34,#0e1012 75%);overflow:hidden}
.case-card .th svg{width:100%;height:100%;display:block}
.case-card .tx{flex:1;min-width:0}
.case-card .stars{color:#c9a24a;font-size:12px;letter-spacing:.1em}
.case-card .done{position:absolute;right:10px;top:8px;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:13px;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;padding:0 6px;transform:rotate(8deg)}
@media (prefers-reduced-motion:reduce){.lamp,.rec i,#hands,#face .blink,#face.tell .pupil,.lk.bust,.tro,.hanko,.paper .thumb,.paper .p-stamp,.clock.low b{animation:none!important}.intro.out{animation:none;opacity:0}}


/* 突きつけの流れ（証拠 → 証言） */
.flow{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.flow .fi{flex:none;width:54px;height:54px;background:rgba(255,255,255,.5);border-radius:10px;display:flex;align-items:center;justify-content:center}
.flow .fi svg{width:42px;height:42px}
.flow .ft{flex:1;min-width:0;font-size:13px;line-height:1.5}
.flow .ft b{display:block;font-size:15px}
.flow .arrow{flex:none;font-size:20px;color:var(--stamp);font-weight:700}
.claim-card{display:block;width:100%;text-align:left;background:rgba(255,255,255,.45);border:2px dashed rgba(0,0,0,.3);border-radius:10px;padding:10px 12px;margin-bottom:8px;color:var(--paper-ink);font-size:15px;line-height:1.5;font-family:"Shippori Mincho B1",serif}
.claim-card.pinned{border:2px solid var(--stamp)}
.claim-card small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:11.5px;margin-top:2px;opacity:.8}
.claim-card.pinned small{color:var(--stamp);opacity:1;font-weight:700}
.act{display:block;width:100%;height:46px;border:none;border-radius:10px;font-weight:700;font-size:15px;margin-top:8px;background:var(--paper-ink);color:var(--paper)}
.act.red{background:var(--stamp);color:#fff}
.act:disabled{opacity:.45}

/* タイトル */
.title{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px;background:radial-gradient(ellipse at 50% 0%,#4a4636 0%,#15171a 55%,#07080a 100%);color:#ece8df;overflow:hidden}
.title .tlamp{position:absolute;top:0;left:50%;width:0;height:0;transform-origin:50% 0;animation:sway 7s ease-in-out infinite}
.title .tlamp i{position:absolute;top:0;left:-1px;width:2px;height:46px;background:#000}
.title .tlamp b{position:absolute;top:44px;left:-34px;width:68px;height:18px;background:linear-gradient(#3a3f44,#17191c);border-radius:8px 8px 22px 22px;box-shadow:0 8px 30px 8px rgba(255,236,180,.35)}
.title .kicker{font-size:13px;letter-spacing:.5em;color:#b9b3a4;margin:0 0 14px;padding-left:.5em}
.title .logo{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:84px;line-height:1;letter-spacing:.04em;color:#f4efe4;margin:0;text-shadow:0 6px 30px rgba(0,0,0,.8);position:relative}
.title .logo span{color:#e5493d}
.title .seal{position:absolute;right:-34px;top:-22px;font-size:17px;letter-spacing:0;color:#e5493d;border:3px solid #e5493d;border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center;transform:rotate(14deg);text-shadow:none;animation:pop .6s .5s cubic-bezier(.2,1.6,.4,1) both}
.title .tag{font-family:"Shippori Mincho B1",serif;font-size:17px;letter-spacing:.2em;margin:18px 0 44px;color:#d8d2c4}
.title .tb{width:min(280px,80%);height:54px;border:none;border-radius:12px;background:#b3261e;color:#fff;font-weight:700;font-size:17px;letter-spacing:.15em;margin-bottom:10px}
.title .tb.sub{background:transparent;border:1px solid rgba(255,255,255,.3);color:#ece8df;height:46px;font-size:15px}
.title .ver{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:11px;color:#7d7a72}
.how .step{display:flex;gap:12px;align-items:center;margin:0 0 12px}
.how .step .n{flex:none;width:52px;height:52px;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center}
.how .step .n svg{width:40px;height:40px}
.how .step b{display:block;font-family:"Shippori Mincho B1",serif;font-size:17px}
.how .step span{font-size:13px;color:var(--muted);line-height:1.5;display:block}
.how h2{font-family:"Shippori Mincho B1",serif;font-size:15px;margin:16px 0 8px;color:var(--muted);font-weight:700}
.case-card .no{font-size:10px;letter-spacing:.15em;color:var(--muted);display:block}
.cover .count{font-size:13px;color:var(--muted);margin:0 0 6px}

/* 顔 */
#face .sweat{opacity:0;transition:opacity .4s;animation:drip 2.2s infinite ease-in}
#face[data-lv="2"] .sweat.s1,#face[data-lv="3"] .sweat,#face[data-lv="4"] .sweat{opacity:1}
#face .sweat.s2{animation-delay:.9s}
@keyframes drip{0%{transform:translateY(0)}80%{transform:translateY(14px)}100%{transform:translateY(14px);opacity:0}}
#face .pupil{transition:transform .25s}
#face.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media (max-height:700px){.suspect{height:196px}}
@media (prefers-reduced-motion:reduce){#face .sweat,#face.shake,.stampline,.chips.picking .chip,.fig,.fig.zoom,.flick,.flash.on,.glow{animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="intro" id="intro"></div>
</div>

function eyeGroup(f, side){
  const e = f.eye, L_ = side < 0, cx = L_ ? 82 : 118, tx = L_ ? -e.dx : e.dx, k = L_ ? "L" : "R";
  const rx = e.rx, ry = e.ry, rot = (e.tilt || 0) * (L_ ? 1 : -1), h = e.hood || 0;
  const top = 110 - ry * (1 - 2 * h) - 0.6, ctrl = 2 * top - 110;
  const outer = L_ ? cx - rx : cx + rx, dir = L_ ? -1 : 1;
  const lashes = e.lash ? `<path d="M${outer} 109.5 l${dir * 3.5} -2.2 M${outer - dir * 1.5} 107.6 l${dir * 2.8} -3 M${outer - dir * 3.5} 106.4 l${dir * 1.6} -3.2" stroke="#0c0705" stroke-width="1.2" stroke-linecap="round"/>` : "";
  return `<g transform="translate(${tx},${e.dy})">
    <ellipse cx="${cx}" cy="108" rx="16" ry="11" fill="url(#sock)" opacity="${e.sock == null ? 1 : e.sock}"/>
    <g transform="rotate(${rot} ${cx} 110)">
      <clipPath id="ec${k}"><ellipse cx="${cx}" cy="110" rx="${rx}" ry="${ry}"/></clipPath>
      <ellipse cx="${cx}" cy="110" rx="${rx}" ry="${ry}" fill="${e.white || "#cdc3aa"}"/>
      <g clip-path="url(#ec${k})">
        <g class="pupil"><circle cx="${cx}" cy="110" r="${e.ir}" fill="${e.iris || "#2a1a10"}"/><circle cx="${cx}" cy="110" r="${(e.ir * .48).toFixed(2)}" fill="#050302"/><circle cx="${cx + e.ir * .35}" cy="${110 - e.ir * .35}" r="${e.hl || .8}" fill="#f1ead8"/></g>
        ${h ? `<rect x="${cx - rx - 1}" y="${110 - ry - 1}" width="${2 * rx + 2}" height="${(2 * ry * h + 1).toFixed(2)}" fill="${f.skin[1]}"/>` : ""}
      </g>
      <ellipse class="blink" cx="${cx}" cy="110" rx="${rx + .7}" ry="${ry + .7}" fill="${f.skin[1]}"/>
      <path d="M${cx - rx - 1.5} 110 Q${cx} ${ctrl.toFixed(2)} ${cx + rx + 1.5} 110" stroke="#0c0705" stroke-width="${e.lid || 2.4}" fill="none" stroke-linecap="round"/>
      ${e.crease ? `<path d="M${cx - rx + .5} ${top - 1.6} Q${cx} ${ctrl - 3.6} ${cx + rx - .5} ${top - 1.6}" stroke="#2b1b15" stroke-width="1" fill="none" opacity=".7"/>` : ""}
      <path d="M${cx - rx + 1} ${110 + ry * .55} Q${cx} ${110 + ry + 1.6} ${cx + rx - 1} ${110 + ry * .55}" stroke="#2b1b15" stroke-width=".9" fill="none" opacity=".55"/>
      ${e.bags ? `<path d="M${cx - rx + 1} ${110 + ry + 2.5} Q${cx} ${110 + ry + 6.5} ${cx + rx - 1} ${110 + ry + 2.5}" stroke="#2b1b15" stroke-width="1.2" fill="none" opacity="${e.bags}"/>` : ""}
      ${lashes}
    </g>
    <line id="brow${k}" x1="${L_ ? 72 : 109}" y1="97" x2="${L_ ? 91 : 128}" y2="97" stroke="${f.brow[0]}" stroke-width="${f.brow[1]}" stroke-linecap="round"/>
    ${f.eyeX ? f.eyeX(cx) : ""}
  </g>`;
}

function ctx(){
  if (!snd) return null;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();

    return AC;
  } catch(e){ return null; }
}
function thump(f0, f1, d, v, delay){
  const a = ctx(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
function burst(d, v, fc, delay){
  const a = ctx(); if (!a) return;
  const t = a.currentTime + (delay || 0), n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = "lowpass"; f.frequency.value = fc; g.gain.value = v;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}

function ambStart(){
  const a = ctx(); if (!a || amb) return;
  try {
    const g = a.createGain(); g.gain.value = 0.0001; g.connect(a.destination);
    const mk = (type, hz, vol, lp) => { const o = a.createOscillator(), gg = a.createGain(); o.type = type; o.frequency.value = hz; gg.gain.value = vol;
      if (lp){ const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp; o.connect(f); f.connect(gg); } else o.connect(gg);
      gg.connect(g); o.start(); return gg; };
    mk("sawtooth", 100, .22, 260);                       // 蛍光灯のうなり
    amb = {g, d1:mk("sine", 146.8, 0), d2:mk("sine", 155.6, 0)};   // 緊張の持続音（追い詰め度で大きくなる）

/* ---- AI呼び出し ---- */
function persona(){
  const sp = sus(), act = activeLies(S.cur), br = brokenOf(S.cur);
  let partner = "";
  if (C.multi && sp.culprit){
    partner = C.suspects.filter(s => s.id !== sp.id && s.culprit).map(o => {
      const n = brokenOf(o.id).length;
      return n ? `・共犯の${o.nick}は、刑事に嘘の一部をすでに認めたらしい。自分だけ罪をかぶるのを恐れ、${o.nick}に罪をなすりつけたくなっている。`
               : `・共犯の${o.nick}のことを聞かれたら庇う。`;
    }).join("\n") + "\n";
  }
  return `${sp.persona}
${sp.truth}

いま使ってよい嘘（関係する質問をされたら、この嘘で答える。言い回しは自由）：
${act.map(id => `${id}: ${L(id).text}\n　　言質の条件＝「${L(id).pin}」／状態＝${S.pinned.has(id) ? "すでに言い切った（撤回できない。聞かれたら同じことを繰り返す）" : "まだ言い切っていない"}`).join("\n") || "なし"}
すでに証拠で崩された嘘（二度と言わない。崩れた事実は渋々認めた前提で話す）：
${br.map(id => `${id}: ${L(id).text}`).join("\n") || "なし"}

ルール：
・真相のうち、崩された嘘で認めた範囲より先は絶対に自分から言わない。証拠なしでは認めない。
・「まだ言い切っていない」嘘は、あいまいに話す。時刻・回数・「一度も」「ずっと」のような言い切りを避け、「たぶん」「そのくらい」でぼかす。ただし刑事が言質の条件と同じ内容を「〜ということですね？」とはっきり確認してきたら、ぼかすと怪しまれるので、その内容をそのまま言い切る。一つの質問で複数の言質の条件をまとめて確認されたら、確認された分はそれぞれ言い切る。聞かれていないのに自分から言い切ることはしない。
・上に無い新しい嘘は作らない。答えたくない質問ははぐらかすか、本当のこと（当たり障りのない事実）を言う。
・刑事の理詰めが的確なら動揺し、見当違いなら余裕を見せる。
・いまの追い詰め度は${cs().stress}/100。高いほど動揺が言葉に出る。
${sp.rules ? sp.rules + "\n" : ""}${partner}・返答は1〜2文、50字以内。短く。地の文やト書きは書かない。`;
}

}

async function ask(q, meta){
  meta = meta || {};
  if (!S || S.busy || S.over || S.phase !== "play" || !String(q).trim()) return;
  lock(true); spend(1);
  addLine("say det", q); cs().hist.push({who:"det", text:q});
  const w = addLine("say sus wait", "……");
  setFace("uneasy");
  const pinHint = meta.pin ? `\n（この質問は「${L(meta.pin).pin}」という言質の条件を確認するもの。${sus().nick}はその内容をはっきり言い切って答える）` : "";
  const res = await safe(callJSON(`${persona()}

これまでのやりとり：
${histText() || "（なし）"}

刑事の今の発言：「${q}」${pinHint}

${sus().nick}としての返答をJSONだけで返す（前置きやコードブロック禁止）：
{"reply":"台詞","lie":"今の台詞で使った嘘のID（使ってよい嘘のどれか）。使っていなければ null","pinned":["今の台詞で、『言質の条件』の内容をはっきり言い切った嘘のIDをすべて（複数可）。なければ空の配列"],"face":"calm|uneasy|sweat|angry|broken のどれか","pressure":刑事の発言がどれだけ核心を突いたか -2〜10 の整数}`));
  w.remove();
  if (res.ok){
    const r = res.v, reply = String(r.reply || "……");
    addLine("say sus", reply); cs().hist.push({who:"sus", text:reply});
    const act = activeLies(S.cur);
    if (meta.lie && act.includes(meta.lie)) noteLie(meta.lie);
    if (act.includes(r.lie)) noteLie(r.lie);
    const pins = [].concat(r.pinned || []).filter(id => act.includes(id));
    if (meta.pin && act.includes(meta.pin) && !pins.includes(meta.pin)) pins.push(meta.pin);
    pins.forEach(pinLie);
    if (pins.length >= 2) addLine("say sys", `一度に${pins.length}つ言質を取った。`);
    const lied = (meta.lie && act.includes(meta.lie)) || act.includes(r.lie);
    if (lied && !pins.length) tell();
    setStress(cs().stress + Math.max(-2, Math.min(10, parseInt(r.pressure, 10) || 0)));
    setFace(r.face in FACES ? r.face : "calm");
  } else {
    spend(-1); cs().hist.pop();
    addLine("say sys", errMsg(res.e));
    if (res.e && res.e.code === "not_granted") S.over = true;
  }
  afterAction();
}

  const lie = L(claim.lie), nick = sus().nick;
  addLine("say det", `（${ev.name}を突きつける）`);
  cs().hist.push({who:"det", text:`（証拠「${ev.name}：${ev.text}」を見せ、${nick}の「${chipText(claim)}」と矛盾すると指摘）`});
  const match = lie.breaks.includes(ev.id);
  const hit = match && S.pinned.has(claim.lie);
  const escaped = match && !hit;
  const tutLie = C.tut && !S.tutOff && claim.lie === C.tut.lie;
  let next = null, finale = false, roomDone = false, situation;
  if (hit){
    claim.broken = true; S.broken.add(claim.lie); S.misses = 0;
    next = activeLies().find(id => L(id).after === claim.lie) || null;
    finale = C.finals.every(id => S.broken.has(id));
    roomDone = !finale && C.finals.includes(claim.lie);
    setStress(cs().stress + C.P.hit);
    renderChips();
    situation = finale
      ? `最後の嘘「${lie.text}」が証拠で崩れた。もう逃げ場はなく、観念しかけている。ただし最後の意地で、${C.lastStand}。真相はまだ何も認めない。`
      : `この証拠で嘘「${lie.text}」は崩れた。うろたえて、その部分は認める。${next && L(next).who === S.cur ? `ただし苦しい言い訳として次の嘘「${L(next).text}」に後退する。` : "それ以上のことは認めず、黙り込むか話をそらす。"}`;
  } else if (escaped){
    S.escaped.add(claim.lie); if (!tutLie) S.mistakes++;
    setStress(cs().stress + C.P.esc); spend(1); setFace("calm");
    situation = `この証拠は痛いところを突いているが、${nick}はまだ「${lie.pin}」とは言い切っていなかったので逃げ道がある。${lie.escape}。嘘そのものは認めない。少し得意げに、長めに喋る。`;
  } else {
    S.misses++; S.mistakes++;
    setStress(cs().stress + C.P.miss); setFace(C.P.miss > 0 ? "angry" : "calm");
    situation = `この証拠はその証言と矛盾しない（見当違い）。${C.P.miss > 0 ? "苛立ち、声を荒げて刑事の指摘の的外れさを責める。" : "余裕を取り戻し、刑事の指摘の弱さを突く。"}`;
  }
  const job = replyJob(situation);
  const SAYS = ["これを見ろ！", "これはどう説明する！", "言い逃れはできないぞ！"];
  await cutin(ev.icon || "talk", SAYS[Math.floor(Math.random() * SAYS.length)], hit ? "hit" : escaped ? "escape" : "miss");
  if (hit) await impact();
  const w = addLine("say sus wait", "……");
  const res = await job;
  w.remove();
  sayReply(res, hit ? "sweat" : escaped ? "calm" : (C.P.miss > 0 ? "angry" : "calm"));
  if (hit){
    (cs().tro = cs().tro || []).push(ev.icon || "talk"); renderTrophies();
    renderLocks(claim.lie); sfx.shatter();
  }
  if (hit && next) noteLie(next);
  if (hit && lie.reward && !S.owned.has(lie.reward.ev)){
    S.owned.add(lie.reward.ev); S.newEv.add(lie.reward.ev);
    addLine("say report", `${lie.reward.report}\n→「${EV(lie.reward.ev).name}」入手`); itemToast(lie.reward.ev);
  }
  if (roomDone) addLine("say sys", `${nick}の嘘はもう残っていない。`);
  if (escaped) addLine("say sys", "言い逃れされた。先に言質を取れ。");
  else if (!match) addLine("say sys", "空振り。");
  if (finale) enterFinal();
  afterAction();
}

/* ---- 行動：裏取り ---- */
function orderCheck(id){
  closeFolder();
  if (!S || S.busy || S.over || S.phase !== "play") return;
  S.checked.add(id);
  spend(1);
  addLine("say det", `（「${chipTextById(id)}」の裏取りを指示）`);
  S.pending.push({lie:id, due:S.turn + 2});
  addLine("say sys", "結果は2手後。");
  afterAction();
}
function deliver(){
  const due = S.pending.filter(p => p.due <= S.turn);
  if (!due.length) return;
  S.pending = S.pending.filter(p => p.due > S.turn);
  due.forEach(p => {
    const ck = L(p.lie).check || {};
    if (ck.ev && !S.owned.has(ck.ev)){
      S.owned.add(ck.ev); S.newEv.add(ck.ev);
      addLine("say report", `【報告】→「${EV(ck.ev).name}」入手`); itemToast(ck.ev);
    } else {
      addLine("say report", "【報告】新しい証拠なし");
    }
  });
  sfx.ping();
}

/* ---- 行動のあとの共通処理 ---- */
function lowWarn(){
  if (C.P.miss >= 0) return;
  if (cs().stress <= 12 && !S.warned){ S.warned = true; addLine("say sys", "相手に余裕が戻っている。席を立たれるぞ。"); }
  else if (cs().stress > 22) S.warned = false;
}
async function lawyer(){
  S.mistakes++;
  addLine("say sys", "——中断——");
  S.lawyerN = (S.lawyerN || 0) + 1;
  const n = S.lawyerN;
  const w = addLine("say sus wait", "……");
  const situation = n <= 1
    ? "刑事の追及にたまりかね、弁護士を呼んでほしいと言い出す。自分の口調らしく。まだ少し余裕は残っている。"
    : `また追及が空振りし、弁護士の話を出すのは今回で${n}回目。前回までと違う言い回しで、うんざりした様子で弁護士を呼ぶよう求める。`;
  let res = null;
  try { res = await replyJob(situation); } catch(e){}
  w.remove();
  if (res && res.ok) sayReply(res, "angry");
  else addLine("say sus", sus().lawyerLine);
  addLine("say sys", "時間を大きく失った。");
  sfx.low();
  spend(3); S.misses = 0;
  setStress(C.P.miss < 0 ? Math.max(cs().stress, C.P.afterLawyer) : C.P.afterLawyer);
  setFace("calm");
}
function walkout(){
  S.over = true; lock(true);
  addLine("say sus", sus().walkLine);
  sfx.low();
  setTimeout(() => ending("walk"), 1800);
}
function checkTime(){
  if (S.over) return;
  if (S.turn >= maxT()){
    S.over = true; lock(true);
    addLine("say sys", "取調べの時間が尽きた。");
    setTimeout(() => ending("time"), 1500);
  }
}
async function afterAction(){
  deliver();
  if (!S.over && S.phase === "play"){
    lowWarn();
    if (S.misses >= C.P.lawyerAt) await lawyer();
    else if (cs().stress <= 0 && C.P.miss < 0) return walkout();
  }
  if (C.tut){
    if (S.tutBreakShown){ S.tutOff = true; tutSave(); }
    if (S.broken.has(C.tut.lie)) S.tutBreakShown = true;
  }
  lock(false);
  renderChips(); renderQuick(); updateHint(); updateEvDot(); renderTabs(); renderLocks();
  checkTime();
}

/* ---- シート（証拠・裏取り） ---- */
function newFolder(extra){ const f = $("folder"); f.className = "folder" + (extra ? " " + extra : ""); f.innerHTML = ""; return f; }
function showFolder(){ $("sheet").classList.add("on"); }
function closeFolder(){ $("sheet").classList.remove("on"); }
function evItems(){
  const items = C.evidence.filter(e => S.owned.has(e.id)).map(e => ({...e}));
  if (C.multi) [...S.pinned].filter(id => L(id).who !== S.cur).forEach(id => {
    const nick = SP(L(id).who).nick;

}

function claimCard(c, onPick){

}
function openEv(claim){
  if (!S || S.busy || S.over || S.phase !== "play") return;

  const f = newFolder();
  f.append(el("h3", "", claim ? "どの証拠を突きつける？" : `証拠品（${S.owned.size}／${C.evidence.length}）`),
           el("p", "hint", claim ? "「" + chipText(claim) + "」と矛盾する証拠を選ぶ" : "タップで詳しく見る" + (S.owned.size < C.evidence.length ? "。まだ手に入っていない証拠がある" : "")));

function showEv(ev, claim){
  const f = newFolder();

  const big = el("div", "ev-big"); big.innerHTML = iconSVG(ev.icon);
  const go = el("button", "ev-present", claim ? "この証言に突きつける" : "これを突きつける"); go.type = "button";
  go.onclick = () => { if (claim){ closeFolder(); present(ev, claim); } else chooseClaim(ev); };
  f.append(back, big, el("h3", "c", ev.name), el("p", "ev-detail", ev.text));
  if (claim) f.append(el("p", "hint", "突きつける相手：「" + chipText(claim) + "」"));

}
function chooseClaim(ev){
  const f = newFolder();
  const back = el("button", "ev-back", "← 証拠を選び直す"); back.type = "button"; back.onclick = () => showEv(ev);
  f.append(back, el("h3", "", "どの証言に突きつける？"), flowHead(ev, "と矛盾する証言を選ぶ"));
  const mine = S.claims.filter(c => !c.broken && L(c.lie).who === S.cur);
  if (!mine.length) f.append(el("p", "hint", "まだ証言がない。先に質問して、喋らせよう。"));
  mine.forEach(c => f.append(claimCard(c, () => { closeFolder(); present(ev, c); })));
}
function openClaim(c){
  if (!S || S.busy || S.over || S.phase !== "play") return;
  const f = newFolder(), pinned = S.pinned.has(c.lie), pend = S.pending.find(p => p.lie === c.lie), done = S.checked.has(c.lie);
  f.append(el("h3", "", "この証言をどうする？"), claimCard(c, () => {}));
  const a1 = el("button", "act red", "証拠を突きつける"); a1.type = "button"; a1.onclick = () => openEv(c);
  const a2 = el("button", "act", pend ? "裏取り中…" : done ? "裏取り済み" : pinned ? "部下に裏を取らせる（2手後に報告）" : "裏取りは言質を取ってから");
  a2.type = "button"; a2.disabled = !!pend || done || !pinned || S.pending.length >= 2; if (!a2.disabled) a2.onclick = () => orderCheck(c.lie);
  f.append(a1, a2);
  if (!pinned) f.append(el("p", "hint", "点線の証言はあいまい。「いつ・どこ・何回」を質問で言い切らせると、赤枠（言質）になる。"));
  showFolder();
}
function openChk(){
  if (!S || S.busy || S.over || S.phase !== "play") return;
  const f = newFolder();
  f.append(el("h3", "", "裏取り"), el("p", "hint", "部下に証言の裏を調べさせる。結果は2手後に届く。調べられるのは、言質を取った証言だけ。部下は同時に2人まで。"));
  const open = S.claims.filter(c => !c.broken);
  if (!open.length) f.append(el("p", "hint", "まだ調べる証言がない。"));
  open.forEach(c => {
    const pinned = S.pinned.has(c.lie), pend = S.pending.find(p => p.lie === c.lie), done = S.checked.has(c.lie);
    let st, can = false;
    if (pend) st = `調査中…（あと${Math.max(1, pend.due - S.turn)}手）`;
    else if (done) st = "確認済み";
    else if (!pinned) st = "あいまいな証言は調べられない。先に言質を。";
    else if (S.pending.length >= 2) st = "部下は手一杯だ。";
    else { st = "この証言の裏を取らせる"; can = true; }
    const who = C.multi ? SP(L(c.lie).who).nick + "：" : "";
    const b = el("button", "ev-card"); b.type = "button";
    b.append(el("b", "", who + "「" + chipText(c) + "」"), el("small", "", st));
    b.disabled = !can; if (can) b.onclick = () => orderCheck(c.lie);
    f.append(b);
  });

}
function startPick(ev){ return chooseClaim(ev); }
function startPickOld(ev){
  closeFolder();
  if (!S.claims.some(c => !c.broken && L(c.lie).who === S.cur)){ addLine("say sys", "まだ証言がない。先に質問を。"); return; }
  S.picking = ev;
  $("pickmsg").textContent = `「${ev.name}」をどの証言に？`;
  $("pickbar").classList.add("on"); $("chips").classList.add("picking");
}
function stopPick(){ if (S) S.picking = null; $("pickbar").classList.remove("on"); $("chips").classList.remove("picking"); }

/* ---- 終盤：事件の組み立て ---- */
function enterFinal(){
  S.phase = "final"; stopPick();
  $("ask").classList.add("final");
}
function openAsm(){
  if (!S || S.over || S.busy || S.phase !== "final") return;
  const f = newFolder("asm chosho");
  f.append(el("h3", "c", "供述調書"), el("p", "hint", C.asm.intro));
  const sent = el("p", "sentence"), optBox = el("div", "optbox");
  const go = el("button", "go", "読み聞かせて、署名を迫る"); go.type = "button";
  const upd = () => { go.disabled = !S.asm.slots.every(s => S.asm.pick[s.key] != null); };
  const by = {}, paint = {};
  S.asm.slots.forEach(s => { by[s.key] = s; });
  const showOpts = s => {
    optBox.innerHTML = ""; optBox.append(el("h4", "", s.label));
    f.querySelectorAll(".blank").forEach(x => x.classList.toggle("cur", x.dataset.k === s.key));
    s.options.forEach((o, i) => {
      const b = el("button", "opt" + (S.asm.pick[s.key] === i ? " sel" : ""), o.t); b.type = "button"; b.dataset.k = s.key;
      b.onclick = () => {
        S.asm.pick[s.key] = i; paint[s.key](); upd();
        const nx = S.asm.slots.find(x => S.asm.pick[x.key] == null);
        if (nx) showOpts(nx); else { optBox.innerHTML = ""; f.querySelectorAll(".blank").forEach(x => x.classList.remove("cur")); }
      };
      optBox.append(b);
    });
  };
  C.asm.template.split(/(\{\w+\})/).forEach(part => {
    const m = part.match(/^\{(\w+)\}$/);
    if (!m){ if (part) sent.append(document.createTextNode(part)); return; }
    const s = by[m[1]], b = el("span", "blank"); b.setAttribute("role", "button"); b.tabIndex = 0; b.dataset.k = s.key;
    b.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); showOpts(s); } };
    paint[s.key] = () => { const i = S.asm.pick[s.key]; b.textContent = i != null ? s.options[i].t : "（" + s.label.split("：")[0] + "）"; b.classList.toggle("filled", i != null); };
    paint[s.key]();
    b.onclick = () => showOpts(s);
    sent.append(b);
  });
  const d = el("details"); d.append(el("summary", "", "証拠と言質を読み返す"));
  C.evidence.filter(e => S.owned.has(e.id)).forEach(e => { const p = el("p"); p.append(el("b", "", e.name + "："), document.createTextNode(e.text)); d.append(p); });
  if (C.multi) [...S.pinned].forEach(id => { const p = el("p"); p.append(el("b", "", SP(L(id).who).nick + "の言質："), document.createTextNode(L(id).pin)); d.append(p); });
  go.onclick = submitAsm; upd();
  f.append(sent, optBox, d, go);
  const first = S.asm.slots.find(x => S.asm.pick[x.key] == null); if (first) showOpts(first);
  showFolder();
}
async function submitAsm(){
  if (!S || S.busy || S.over || S.phase !== "final") return;
  const slots = S.asm.slots;
  const sel = slots.map(s => ({s, o:s.options[S.asm.pick[s.key]]}));
  if (sel.some(x => !x.o)) return;
  const nOk = sel.filter(x => x.o.ok).length;
  closeFolder(); lock(true);
  if (nOk === slots.length){
    await cutin("doc", "この調書に、署名しろ。", "sign", "", "自白");
    return confess();
  }
  spend(2); S.mistakes++;
  addLine("say det", "（調書を読み聞かせる）");
  cs().hist.push({who:"det", text:"（事件の筋書きを書いた調書を読み聞かせ、署名を迫った）"});
  const situation = nOk === 0
    ? "刑事が読み上げた調書は全部間違っている。余裕を取り戻し、「的外れだ」と笑い飛ばす。真相は言わない。"
    : `刑事が読み上げた調書は、一部だけ当たっている（${nOk}／${slots.length}項目）。内心ぎくりとするが、顔には出さず「全然違う」と否定する。どこが当たっているかは絶対に言わない。`;
  const job = replyJob(situation);
  await cutin("doc", "この調書に、署名しろ。", "refuse");
  const w = addLine("say sus wait", "……");
  const res = await job;
  w.remove();
  sayReply(res, "calm");
  addLine("say sys", `合っているのは ${nOk}／${slots.length}`);
  setStress(cs().stress - 6); setFace("calm");
  afterAction();
}
async function confess(){
  S.over = true; lock(true);
  const cul = C.suspects.filter(s => s.culprit);
  if (!sus().culprit && cul.length){ S.cur = cul[0].id; enterRoom(); renderTabs(); }
  const sp = sus();
  setStress(100); setFace("broken", true); swingLamp();
  $("suspect").classList.add("fallen");
  const w = addLine("say sus wait", "……");
  let text = C.confessFallback;
  const others = cul.filter(s => s.id !== sp.id).map(s => s.nick);
  try{
    const r = await sample(`${sp.persona}
${sp.truth}

これまでのやりとり：
${histText()}

最後の嘘が崩れ、刑事が読み上げた調書（${slotsText()}）も、すべて当たっていた。${sp.nick}は観念して自白する。${others.length ? `共犯の${others.join("・")}のことも隠さずに話す。` : ""}真相に沿って、動機、${C.when}に何があったか、いまの気持ちを、${sp.nick}の一人語りで${C.confessLen}で話す。台詞だけを書く。`, {modelTier:"quick", cache:false});
    if (r && r.text && r.text.trim()) text = r.text.trim();
  }catch(e){}
  let yomi = null;
  try{
    const yj = await sample.json(`次の文の読みをJSONだけで返す（前置き・コードブロック禁止）：{"yomi":"全文をひらがなの読みに直したもの（漢字は使わない。句読点はそのまま。文脈に合う読みを選ぶこと。例：「行ったことある」は「いったことある」と読む）"}
文：${text}`, {modelTier:"quick", cache:false});
    if (yj && yj.yomi) yomi = String(yj.yomi);
  }catch(e){}
  w.remove();
  const line = addLine("say sus", text, {slow:true, yomi});
  await Promise.race([line._typed, sleep(16000)]);
  await sleep(1300);
  ending("win", text);
}
function slotsText(){ return C.asm.slots.map(s => s.label.split("：")[0]).join("・"); }

/* ---- 結末 ---- */
function rank(){
  const t = S.turn, m = S.mistakes, mx = maxT();
  if (t <= mx * 0.67 && m <= 1) return {r:"S", t:"名刑事"};
  if (t <= mx * 0.84 && m <= 4) return {r:"A", t:"敏腕"};
  return {r:"B", t:"一人前"};
}
function clears(){ try { return JSON.parse(localStorage.getItem("itg_clear") || "{}"); } catch(e){ return {}; } }
function saveClear(id, r){
  try { const c = clears(), order = "BAS"; if (!c[id] || order.indexOf(r) > order.indexOf(c[id])) c[id] = r; localStorage.setItem("itg_clear", JSON.stringify(c)); } catch(e){}
}

  S.over = true; clearTimeout(beatT); ambSet(); stopSpeak();

    const cul = C.suspects.filter(s => s.culprit).map(s => s.name).join("・");
    const sign = el("p", "p-sign", "供述人　" + cul); sign.append(el("span", "thumb"));
    const hk = el("div", "hanko"); hk.append(el("b", "", rk.r), el("span", "", rk.t));
    pp.append(el("p", "p-body", text), sign, el("p", "p-stats", `所要 ${tm}／崩した嘘 ${S.broken.size}／空振り ${S.mistakes}`), hk, el("div", "p-stamp", "自白"));
    sfx.door();
  } else {
    pp.append(el("p", "p-body", kind === "walk" ? C.walkEnd : C.timeLine),
              el("p", "p-stats", `崩した嘘 ${S.broken.size}／${total}。先に言質、それから証拠。`), el("div", "p-stamp gray", "釈放"));

function renderCover(){

async function playIntro(){
  if (FAST) return;
  const o = $("intro"); o.className = "intro on"; o.innerHTML = "";
  let skip = false; o.onclick = () => { skip = true; };
  const lines = [C.startLine.replace(" 取調べ開始", ""), "取調室", "容疑者　" + C.suspects.map(s => s.name).join("・")];
  for (const t of lines){
    const p = el("p", "", ""); o.append(p);
    for (let i = 1; i <= t.length && !skip; i++){ p.textContent = t.slice(0, i); if (i % 2) sfx.type(); await sleep(48); }
    p.textContent = t;
    if (!skip) await sleep(360);
  }
  sfx.door(); o.classList.add("out");
  await sleep(skip ? 200 : 650);
  o.className = "intro"; o.innerHTML = ""; o.onclick = null;
}

}

// ---- Groq版 sample（プロキシ優先、予備に自分のキーで直接） ----
function proxyAvailable(){ return location.protocol.indexOf("http")===0 && (location.hostname.slice(-9)==="pages.dev"||location.hostname==="localhost"||location.hostname==="127.0.0.1"); }
function groqKey(){ try{ return localStorage.getItem("groq-api-key")||""; }catch(e){ return ""; } }
const GROQ_MODELS=["qwen/qwen3.8-27b","openai/gpt-oss-20b","openai/gpt-oss-120b"];
async function proxyText(prompt, opts){
  const res=await fetch("/api/groq",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt}),signal:opts&&opts.signal});
  if(res.status===429) throw {code:"rate_limited"};
  if(res.status===401||res.status===403) throw {code:"not_granted"};
  if(!res.ok) throw {code:"unavailable"};
  const data=await res.json(); if(!data||!data.text) throw {code:"unavailable"};
  return data.text;
}
async function directText(prompt, opts){
  const key=groqKey(); if(!key) throw {code:"unavailable"};
  for(const model of GROQ_MODELS){
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json"},body:JSON.stringify({model,messages:[{role:"user",content:prompt}],temperature:0.8,max_tokens:1000}),signal:opts&&opts.signal});
      if(res.status===429) throw {code:"rate_limited"};
      if(res.status===401||res.status===403) throw {code:"not_granted"};
      if(!res.ok) continue;
      const data=await res.json();
      const text=data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
      if(text) return text;
    }catch(e){ if(e&&e.code) throw e; }
  }
  throw {code:"unavailable"};
}
async function aiText(prompt, opts){
  if(proxyAvailable()){
    try{ return await proxyText(prompt, opts); }
    catch(e){ if(e&&(e.code==="rate_limited"||e.code==="not_granted")) throw e; }
  }
  return directText(prompt, opts);
}
function makeSample(){
  const fn=async (prompt, opts)=>({text: await aiText(prompt, opts)});
  fn.json=async (prompt, opts)=>{
    const text=await aiText(prompt, opts);
    const a=text.indexOf("{"), b=text.lastIndexOf("}");
    if(a<0||b<0) throw {code:"unavailable"};
    return JSON.parse(text.slice(a, b+1));
  };
  return fn;
}
